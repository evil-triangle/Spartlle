<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋盘塔防 · 对抗模式</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* 关掉 html 的滚动传播：否则 body 的 overflow-y:auto 会被规范传播给 viewport，
     实际滚动的变成 documentElement，body.scrollTop 恒为 0，容器不明确。 */
  html { overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #12122a 0%, #05050d 80%);
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100%;
    /* body 是唯一的纵向滚动容器：棋盘尺寸固定，底栏展开时不缩小棋盘，
       被盖住的部分靠上下滑动移出来看。滚动留白 --pad-bottom 由 layoutChrome 写入。 */
    display: block;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    /* 不留 padding：滚动留白放在 .content-wrap 上。
       若加在 body 上，min-height:100% 会把它扣掉，滚动就不能生效。 */
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* 有余量时把 HUD + 棋盘 + 提示整组居中；内容超高时容器被内容撑开，顶部不会被裁掉 */
  .content-wrap {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    /* 底部留白 = 底栏当前高 + 余量，保证能把棋盘下沿滚到底栏上方。--pad-bottom 由 layoutChrome 写入 */
    padding: 8px 12px calc(var(--pad-bottom, 160px) + 8px);
  }

  .hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-radius: 12px;
    background: rgba(20,20,40,0.7);
    border: 1px solid #2a2a4e;
    /* 宽度跟着棋盘走，但给个下限：面板展开把棋盘压小时，HUD 不至于挤成一团 */
    width: min(100%, max(var(--hud-size, 780px), 340px));
    flex-shrink: 0;
    gap: 8px;
  }
  .player-panel { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .dot.p1 { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }
  .dot.p2 { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

  .stat-box {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 8px;
    background: rgba(0,0,0,0.35);
    border: 1px solid #2a2a4e;
    transition: all 0.2s;
    user-select: none;
  }
  .stat-icon { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-icon svg { width: 100%; height: 100%; display: block; }
  .stat-value { font-weight: 800; font-size: 15px; min-width: 16px; text-align: center; line-height: 1; white-space: nowrap; }
  .stat-label { font-size: 10px; color: #6b6b8a; letter-spacing: 0.3px; line-height: 1; white-space: nowrap; }

  .stat-box.meteor-box { border-color: rgba(251,191,36,0.30); background: rgba(251,191,36,0.05); }
  .stat-box.meteor-box .stat-icon { color: #fbbf24; }
  .stat-box.meteor-box .stat-value { color: #fbbf24; }

  .stat-box.beacon-box {
    border-color: rgba(45,212,191,0.25);
    background: rgba(45,212,191,0.04);
    cursor: pointer; transition: all 0.2s;
  }
  .stat-box.beacon-box .stat-icon { color: #4b7c7a; }
  .stat-box.beacon-box .stat-value { color: #94a3b8; }
  .stat-box.beacon-box .stat-label { color: #4b6c6c; }
  .stat-box.beacon-box:hover {
    border-color: #2dd4bf;
    background: rgba(45,212,191,0.14);
    box-shadow: 0 0 10px rgba(45,212,191,0.25);
  }
  .stat-box.beacon-box.active {
    border-color: #2dd4bf;
    background: rgba(45,212,191,0.14);
    box-shadow: 0 0 12px rgba(45,212,191,0.45);
  }
  .stat-box.beacon-box.active .stat-icon { color: #5eead4; }
  .stat-box.beacon-box.active .stat-value { color: #5eead4; }
  .stat-box.beacon-box.active .stat-label { color: #2dd4bf; }

  .turn-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .turn {
    padding: 4px 12px; border-radius: 999px;
    background: #1e3a8a; color: #dbeafe;
    font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .turn.p2 { background: #7f1d1d; color: #fee2e2; }

  .voucher-stack {
    display: flex; gap: 5px; flex-wrap: wrap;
    justify-content: center;
    min-height: 18px;
  }
  .voucher-badge {
    padding: 2px 10px; border-radius: 4px;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.55);
    color: #fbbf24;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.8px;
    animation: voucherPulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes voucherPulse {
    0%, 100% { box-shadow: 0 0 0 rgba(251, 191, 36, 0); }
    50%      { box-shadow: 0 0 14px rgba(251, 191, 36, 0.6); }
  }

  canvas {
    display: block; border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9), 0 0 0 1px #2a2a4e;
    cursor: pointer; touch-action: manipulation; flex-shrink: 0;
  }
  .hint { font-size: 12px; color: #6b6b8a; text-align: center; min-height: 16px; max-width: 92vw; }
  .hint.touch { display: none; }

  .turn-banner {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 8;
  }
  .banner-content {
    text-align: center;
    padding: 22px 66px; border-radius: 22px;
    background: rgba(15,15,30,0.92);
    border: 2px solid #3b82f6;
    box-shadow: 0 0 60px rgba(59,130,246,0.5);
    opacity: 0; transform: scale(0.85);
    will-change: opacity, transform;
  }
  .banner-content.play { animation: bannerPop 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
  @keyframes bannerPop {
    0%   { opacity: 0; transform: scale(0.82); }
    14%  { opacity: 1; transform: scale(1.06); }
    24%  { opacity: 1; transform: scale(1.00); }
    72%  { opacity: 1; transform: scale(1.00); }
    100% { opacity: 0; transform: scale(1.03); }
  }
  .banner-title {
    font-size: 38px; font-weight: 900; letter-spacing: 3px;
    color: #93c5fd; text-shadow: 0 0 24px currentColor; line-height: 1.1;
  }
  .banner-title.p2 { color: #fca5a5; }
  .banner-sub {
    margin-top: 8px; font-size: 15px; font-weight: 700;
    letter-spacing: 1.5px; color: #fbbf24;
    text-shadow: 0 0 14px rgba(251,191,36,0.6);
    display: none;
  }
  .banner-sub.show { display: block; }
  .banner-sub.beacon { color: #2dd4bf; text-shadow: 0 0 14px rgba(45,212,191,0.6); }

  .info-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.72);
    display: none; align-items: center; justify-content: center;
    z-index: 12; backdrop-filter: blur(6px);
  }
  .info-overlay.show { display: flex; }
  .info-content {
    width: 460px; max-height: 82vh; overflow-y: auto;
    background: linear-gradient(180deg, #1a1a2e 0%, #15152a 100%);
    border: 2px solid #2dd4bf;
    border-radius: 16px;
    padding: 22px 26px;
    box-shadow: 0 0 60px rgba(45,212,191,0.4);
    animation: infoPop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes infoPop {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  .info-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 1px solid #2a2a4e;
  }
  .info-header-icon {
    width: 26px; height: 26px; color: #2dd4bf;
    display: flex; align-items: center; justify-content: center;
  }
  .info-header-icon svg { width: 100%; height: 100%; display: block; }
  .info-header h2 { font-size: 19px; font-weight: 800; color: #5eead4; letter-spacing: 1px; }
  .info-body { font-size: 13px; line-height: 1.7; color: #cbd5e1; }
  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px dashed rgba(42,42,78,0.8);
  }
  .info-row:last-of-type { border-bottom: none; }
  .info-label { color: #94a3b8; }
  .info-value { color: #fff; font-weight: 700; }
  .info-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid #2a2a4e; }
  .info-section-title {
    font-size: 12px; font-weight: 800; color: #5eead4;
    letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase;
  }
  .info-list { list-style: none; padding-left: 0; margin-top: 4px; }
  .info-list li { padding: 5px 0 5px 18px; position: relative; color: #cbd5e1; }
  .info-list li::before {
    content: '·'; position: absolute; left: 6px; top: 2px;
    color: #2dd4bf; font-size: 20px; line-height: 1; font-weight: 900;
  }
  .info-list li b { color: #5eead4; }
  .info-note { color: #94a3b8; font-size: 12px; margin-top: 6px; font-style: italic; }
  .info-close {
    margin-top: 20px; width: 100%;
    padding: 10px; border-radius: 8px;
    background: #0d2a2a; color: #5eead4;
    border: 1px solid #2dd4bf;
    font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .info-close:hover { background: #0f3838; box-shadow: 0 0 14px rgba(45,212,191,0.4); }
  .info-close:active { transform: scale(0.98); }

  .info-overlay.gold .info-content {
    border-color: #fbbf24;
    box-shadow: 0 0 60px rgba(251,191,36,0.4);
  }
  .info-overlay.gold .info-header-icon { color: #fbbf24; }
  .info-overlay.gold .info-header h2 { color: #fde68a; }
  .info-overlay.gold .info-section-title { color: #fcd34d; }
  .info-overlay.gold .info-list li::before { color: #fbbf24; }
  .info-overlay.gold .info-list li b { color: #fcd34d; }
  .info-overlay.gold .info-close {
    background: #2a1f08; color: #fcd34d; border-color: #fbbf24;
  }
  .info-overlay.gold .info-close:hover {
    background: #3d2c08; box-shadow: 0 0 14px rgba(251,191,36,0.4);
  }

  .bottom-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px));
    pointer-events: none; z-index: 5;
    background: linear-gradient(0deg, rgba(5,5,13,0.98) 0%, rgba(5,5,13,0.86) 68%, rgba(5,5,13,0) 100%);
    /* 底栏自身不盖棋盘：棋盘尺寸由 fitCanvas 扣除这里的实际高度 */
  }
  .piece-panel {
    pointer-events: auto;
    display: none; gap: 8px; padding: 8px;
    border-radius: 14px;
    background: rgba(15,15,30,0.96);
    border: 1px solid #2a2a4e;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    flex-wrap: wrap; justify-content: center;
    max-width: min(96vw, 860px);
    max-height: 42vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .piece-panel.show { display: flex; }
  .piece-card {
    width: 232px; padding: 9px 10px;
    border-radius: 12px;
    background: linear-gradient(180deg, #1a1a2e 0%, #15152a 100%);
    border: 1px solid #333355;
    display: flex; gap: 9px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .piece-card:hover { border-color: #4a4a7a; transform: translateY(-2px); }
  .piece-card.disabled { opacity: 0.45; pointer-events: none; }
  .piece-card.current { border-color: #fbbf24; box-shadow: 0 0 16px rgba(251,191,36,0.35); }
  .piece-card.voucher-card {
    border-color: rgba(251, 191, 36, 0.65);
    box-shadow:
      0 0 0 1px rgba(251, 191, 36, 0.35),
      0 0 18px rgba(251, 191, 36, 0.35);
    animation: cardVoucherPulse 2.4s ease-in-out infinite;
  }
  @keyframes cardVoucherPulse {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(251, 191, 36, 0.35),
        0 0 18px rgba(251, 191, 36, 0.25);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(251, 191, 36, 0.55),
        0 0 26px rgba(251, 191, 36, 0.55);
    }
  }

  .card-icon { width: 44px; height: 44px; flex-shrink: 0; display: block; }
  .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .card-name {
    font-size: 15px; font-weight: 700; color: #fff;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .card-tag {
    font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 4px;
    background: #2a2a4e; color: #94a3b8; letter-spacing: 0.5px;
  }
  .card-tag.gold {
    background: #78350f; color: #fcd34d;
    border: 1px solid rgba(251,191,36,0.6);
    box-shadow: 0 0 8px rgba(251,191,36,0.35);
    animation: tagPulse 2.4s ease-in-out infinite;
  }
  @keyframes tagPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(251,191,36,0.3); }
    50%      { box-shadow: 0 0 14px rgba(251,191,36,0.7); }
  }
  .card-desc {
    font-size: 11px; line-height: 1.45; color: #94a3b8; flex: 1;
    max-height: 62px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
  .card-cost {
    font-size: 12px; font-weight: 700; color: #fbbf24;
    display: flex; align-items: center; gap: 4px;
  }
  .card-cost::before { content: '◆'; font-size: 10px; color: #fbbf24; }
  .cost-strike {
    font-size: 10px; color: #64748b;
    text-decoration: line-through; font-weight: 500;
    margin-left: 4px;
  }
  .card-cost.discounted {
    color: #fde68a;
    text-shadow: 0 0 10px rgba(251,191,36,0.6);
    font-size: 14px;
  }

  .card-btn {
    padding: 5px 14px; border-radius: 6px;
    background: #1e3a8a; color: #dbeafe;
    border: 1px solid #3b82f6;
    font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .card-btn:hover { background: #1e40af; box-shadow: 0 0 12px rgba(59,130,246,0.5); }
  .card-btn:active { transform: scale(0.95); }
  .card-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .piece-card.voucher-card .card-btn {
    background: #78350f; color: #fef3c7;
    border-color: #fbbf24;
  }
  .piece-card.voucher-card .card-btn:hover {
    background: #92400e;
    box-shadow: 0 0 14px rgba(251,191,36,0.55);
  }

  .action-menu {
    pointer-events: auto;
    display: none; gap: 10px; padding: 10px 12px;
    border-radius: 14px;
    background: rgba(15,15,30,0.94);
    border: 1px solid #2a2a4e;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    align-items: center;
  }
  .action-menu.show { display: flex; }
  .action-menu-label { font-size: 12px; color: #94a3b8; padding: 0 6px 0 2px; font-weight: 600; }
  .action-menu-label.highlight { color: #fbbf24; font-weight: 700; }
  .action-btn {
    padding: 9px 24px; border-radius: 9px;
    background: #1a1a2e; border: 1px solid #333355;
    color: #e0e0e0; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }
  .action-btn:hover {
    background: #252542; border-color: #60a5fa;
    color: #dbeafe; box-shadow: 0 0 12px rgba(96,165,250,0.35);
  }
  .action-btn:active { transform: scale(0.96); }
  .action-btn.cancel { border-color: #7f1d1d; color: #fca5a5; }
  .action-btn.cancel:hover { border-color: #ef4444; box-shadow: 0 0 12px rgba(239,68,68,0.35); }

  .cat-bar {
    pointer-events: auto;
    display: flex; gap: 10px;
    padding: 8px; border-radius: 14px;
    background: rgba(15,15,30,0.94);
    border: 1px solid #2a2a4e;
    box-shadow: 0 -6px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    flex-wrap: wrap; justify-content: center;
  }
  .cat-tab {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 9px;
    background: transparent; border: 1px solid transparent;
    color: #94a3b8;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.15s;
  }
  .cat-tab:hover:not(:disabled) { background: #1a1a2e; color: #e0e0e0; }
  .cat-tab.active {
    background: #1e3a8a; color: #dbeafe;
    border-color: #60a5fa;
    box-shadow: 0 0 14px rgba(96,165,250,0.4);
  }
  .cat-tab:disabled { opacity: 0.35; cursor: not-allowed; }
  .cat-emoji { font-size: 15px; line-height: 1; }

  .cat-tab.core-tab { border: 1px solid #78350f; background: #1c1408; color: #fcd34d; }
  .cat-tab.core-tab:hover:not(:disabled) { background: #292008; border-color: #fbbf24; color: #fde68a; }
  .cat-tab.core-tab.active {
    background: #78350f; color: #fef3c7; border-color: #fbbf24;
    box-shadow: 0 0 16px rgba(251,191,36,0.55);
  }
  .cat-tab.core-tab.p1-own {
    border-color: #3b82f6;
    background: rgba(30,58,138,0.35);
    color: #bfdbfe;
  }
  .cat-tab.core-tab.p2-own {
    border-color: #ef4444;
    background: rgba(127,29,29,0.35);
    color: #fecaca;
  }
  .cat-tab.core-tab .core-status {
    font-size: 10px; padding: 1px 6px;
    border-radius: 4px; background: rgba(0,0,0,0.5); letter-spacing: 0.3px;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 10; backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .overlay-content {
    text-align: center; padding: 40px 60px; border-radius: 20px;
    background: #15152a; border: 2px solid #3b82f6;
    box-shadow: 0 0 60px rgba(59,130,246,0.4);
  }
  .overlay-content h1 { font-size: 42px; margin-bottom: 16px; color: #fbbf24; }
  .overlay-content button {
    margin-top: 20px; padding: 10px 28px; border-radius: 8px;
    background: #1e3a8a; color: white; border: none; font-size: 15px;
    cursor: pointer; font-weight: 600;
  }

  /* ===== 窄屏（手机） ===== */
  @media (max-width: 640px) {
    body { padding: 6px 8px; padding-bottom: calc(var(--dock-h, 150px) + 8px); gap: 6px; }
    .hud { padding: 6px 8px; border-radius: 10px; gap: 4px; }
    .player-panel { gap: 4px; }
    .stat-box { padding: 4px 6px; gap: 4px; }
    .stat-value { font-size: 13px; min-width: 14px; }
    /* 窄屏优先保数字："陨石/信标"这行文字会挤成竖排，直接隐藏 */
    .stat-label { display: none; }
    .turn { font-size: 11px; padding: 3px 8px; letter-spacing: 0; }
    .hint { font-size: 10.5px; min-height: 0; padding: 0 4px; line-height: 1.3; }
    .voucher-badge { font-size: 9px; padding: 1px 6px; }

    .piece-panel { gap: 6px; padding: 6px; max-height: 38vh; max-width: calc(100vw - 12px); }
    .piece-card { width: calc(50vw - 14px); min-width: 150px; padding: 7px 8px; gap: 7px; }
    .card-icon { width: 34px; height: 34px; }
    .card-name { font-size: 12.5px; gap: 4px; }
    .card-tag { font-size: 9px; padding: 0 4px; }
    .card-desc { font-size: 10.5px; line-height: 1.4; max-height: 46px; }
    .card-btn { padding: 4px 10px; font-size: 11px; }
    .card-cost { font-size: 11px; }

    .action-menu { gap: 6px; padding: 7px 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 12px); }
    .action-menu-label { font-size: 11px; }
    .action-btn { padding: 7px 16px; font-size: 12.5px; }

    .cat-bar { gap: 5px; padding: 5px; max-width: calc(100vw - 12px); }
    .cat-tab { padding: 6px 10px; font-size: 11.5px; gap: 5px; }
    .cat-emoji { font-size: 13px; }
    .cat-tab.core-tab .core-status { font-size: 9px; padding: 0 4px; }

    .info-content { width: calc(100vw - 24px); max-height: 80vh; padding: 16px 16px; }
    .info-header h2 { font-size: 16px; }
    .info-body { font-size: 12px; }
    .overlay-content { padding: 26px 24px; width: calc(100vw - 40px); }
    .overlay-content h1 { font-size: 26px; margin-bottom: 10px; }
    .banner-title { font-size: 26px; letter-spacing: 2px; }
    .banner-content { padding: 16px 30px; }
    .banner-sub { font-size: 13px; }
  }

  /* ===== 横屏 / 矮屏：竖直空间优先给棋盘 ===== */
  @media (max-height: 520px) {
    .hint { display: none; }
    .hint.touch { display: none; }
    .hud { padding: 5px 8px; }
    .voucher-stack { display: none; }
    /* 矮屏先保数字："陨石/信标"这类标签会把 HUD 挤成一团 */
    .stat-label { display: none; }
    .stat-box { padding: 4px 7px; }
    .turn { font-size: 11px; padding: 3px 9px; letter-spacing: 0; }
    .piece-card { width: 200px; padding: 6px 8px; }
    .card-desc { display: none; }
    /* 矮屏：分类面板横向滑动，避免展开后把棋盘压成一条缝 */
    .piece-panel {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      justify-content: flex-start; max-height: none;
      max-width: calc(100vw - 16px);
      -webkit-overflow-scrolling: touch;
    }
    .piece-card { width: auto; min-width: 128px; flex: 0 0 auto; align-items: center; }
    .card-body { gap: 2px; }
    .card-footer { margin-top: 0; }
    .cat-tab { padding: 5px 9px; font-size: 11px; }
    .cat-bar { gap: 4px; padding: 4px; }
    .bottom-bar { gap: 4px; padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); }
  }

  /* 触屏：鼠标悬停提示没有意义，换成常驻的操作提示 */
  @media (hover: none) {
    .hint { font-size: 11px; }
  }
</style>
</head>

    <div class="stat-box meteor-box" title="陨石余额">
      <span class="stat-icon">
        <svg viewBox="0 0 16 16"><path d="M8 1 L15 8 L8 15 L1 8 Z" fill="currentColor"/></svg>
      </span>

</div>

<canvas id="board"></canvas>

<script src="js/util.js"></script>

<script src="js/pieces.js"></script>

<script src="js/save.js"></script>
<script>
(() => {
  'use strict';

  const CFG = { N: 15, DPR: Math.min(window.devicePixelRatio || 1, 2) };
  const CORE_POS = { col: 7, row: 7 };
  const BEACONS = [
    { col: 0,  row: 14 },
    { col: 14, row: 0  },
  ];

  const CELL = 52; // 逻辑格宽：棋盘内部坐标系固定 15×52=780，显示尺寸由 fitCanvas 缩放

  const DIRS8 = [
    { dc: 1, dr: 0 }, { dc: -1, dr: 0 },
    { dc: 0, dr: 1 }, { dc: 0, dr: -1 },
    { dc: 1, dr: 1 }, { dc: 1, dr: -1 },
    { dc: -1, dr: 1 }, { dc: -1, dr: -1 },
  ];
  const DIRS4 = [
    { dc: 1, dr: 0 }, { dc: -1, dr: 0 },
    { dc: 0, dr: 1 }, { dc: 0, dr: -1 },
  ];
  const DIAG4 = [
    { dc: 1, dr: 1 }, { dc: 1, dr: -1 },
    { dc: -1, dr: 1 }, { dc: -1, dr: -1 },
  ];

  const PIECE_TYPES = SL.PIECE_TYPES;

  const CATEGORIES = SL.CATEGORIES;

  const CORE_FUNCTIONS = {
    yield: {
      name: '收益', icon: '★',
      desc: '回合开始时占领星核的一方收获的陨石 × 1.17，向下取整。',
    },
    defense: {
      name: '强防', icon: '⛨',
      desc: '若对方回合中星核处于己方占领状态，则对方此回合对己方造成的所有伤害 −1（最低 1）。',
    },
    transfer: {
      name: '转移', icon: '➤',
      desc: '消耗本回合，并消耗 30 陨石，将己方一个场上棋子移动到星核周围 5×5 区域中的一个空格。（激活 + 使用共 40）',
    },
  };

  const BEACON_BUFF = {
    1: { chance: 0.70, name: '70%' },
    2: { chance: 0.95, name: '95%' },
  };

  const VOUCHER_PRICES = {
    mage: 40,
    warrior: 6,
  };
  const VOUCHER_LABELS = {
    mage: '法师券',
    warrior: '勇士券',
  };

  const ACTIONS = {
    shoot:       { name: '射击' },
    shootCannon: { name: '发射炮弹' },
    attack:      { name: '攻击' },
    move:        { name: '移动' },
    spawn:       { name: '生成' },
    raid:        { name: '突袭' },
    charge:      { name: '冲锋' },
    droneMove:   { name: '移动' },
    droneShoot:  { name: '发射炮弹' },
  };

  const C = {
    empty: '#0f0f1a', grid: '#1e1e30',
    base1Tint: '#101c3d', fort1Tint: '#0f1830',
    base2Tint: '#2a0e14', fort2Tint: '#261014',
    coreTint: '#241634', beaconTint: '#0d2a2a',
    coreNeutral: '#fbbf24', coreP1: '#60a5fa', coreP2: '#f87171',
    beaconMark: '#2dd4bf',
    p1: '#3b82f6', p1d: '#1e40af', p1l: '#93c5fd',
    p2: '#ef4444', p2d: '#991b1b', p2l: '#fca5a5',
    hover: '#ffffff', select: '#fbbf24', valid: '#22c55e',
    aim: '#22c55e', aimEmpty: '#64748b',
    attack: '#ef4444',
    spawn: '#a855f7',
    raid: '#fb923c',
    charge: '#f43f5e',
    shell: '#fb923c', shellCore: '#fff7ed',
    droneShell: '#22d3ee', droneShellCore: '#ecfeff',
    explosionHot: '#fff7ed', explosionMid: '#fb923c', explosionEdge: 'rgba(234,88,12,0)',
    droneExplosionHot: '#ecfeff', droneExplosionMid: '#22d3ee', droneExplosionEdge: 'rgba(34,211,238,0)',
  };

  function cellType(col, row) {
    const N = CFG.N, M = (N - 1) / 2;
    if (col === 0 && row === 0) return 'base1';
    if (col === N-1 && row === N-1) return 'base2';
    if (col <= 1 && row <= 1 && !(col === 0 && row === 0)) return 'fort1';
    if (col >= N-2 && row >= N-2 && !(col === N-1 && row === N-1)) return 'fort2';
    if (col === 0 && row === N-1) return 'beacon';
    if (col === N-1 && row === 0) return 'beacon';
    if (col === M && row === M) return 'core';
    return 'empty';
  }
  function cellRect(col, row) {
    return { x: col*CELL, y: (CFG.N-1-row)*CELL, w: CELL, h: CELL };
  }
  function cellCenter(col, row) {
    const r = cellRect(col, row);
    return { x: r.x + r.w/2, y: r.y + r.h/2 };
  }
  function pixelToCell(px, py) {
    const col = Math.floor(px / CELL);
    const row = CFG.N - 1 - Math.floor(py / CELL);
    if (col < 0 || col >= CFG.N || row < 0 || row >= CFG.N) return null;
    return { col, row };
  }
  const key = (c, r) => c + ',' + r;
  const inBounds = (c, r) => c >= 0 && c < CFG.N && r >= 0 && r < CFG.N;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const SIZE = CFG.N * CELL;

  // 逻辑坐标始终是 SIZE×SIZE（15×52=780），显示尺寸由 fitCanvas 决定。
  // 绘制时统一叠加 scale，因此下面所有 cellRect / 半径计算都不用关心缩放。
  let viewScale = 1;

  // ==================== 尺寸自适应：固定棋盘 + 纵向滚动 ====================
  // 棋盘边长只由「视口」决定，绝不读 HUD / 底栏的实时高度：
  // 展开棋子面板 / 操作菜单时棋盘尺寸不会跳动；被底栏盖住的部分靠 body 纵向滚动移出来看。
  function layoutChrome() {
    const dock = document.querySelector('.bottom-bar');
    const dockH = dock ? dock.getBoundingClientRect().height : 120;
    // 底部滚动留白 = 底栏当前高 + 余量，保证能把棋盘下沿滚到底栏上方
    document.documentElement.style.setProperty('--pad-bottom', Math.ceil(dockH + 40) + 'px');
  }

  function fitCanvas() {
    const availW = Math.max(120, window.innerWidth - 24);
    const availH = Math.max(120, window.innerHeight - 150);
    const css = Math.floor(Math.min(availW, availH));

    viewScale = css / SIZE;
    const dpr = CFG.DPR;
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    canvas.style.width = css + 'px';
    canvas.style.height = css + 'px';
    const root = document.documentElement;
    root.style.setProperty('--board-size', css + 'px');
    root.style.setProperty('--hud-size', css + 'px');
    layoutChrome();
  }

  const state = {
    turn: 1,
    meteors: { 1: 5, 2: 10 },
    pieces: new Map(),
    hover: null,
    placing: null,
    controlled: null,
    controlAction: null,
    openCategory: null,
    arrows: [],
    shells: [],
    explosions: [],
    gameOver: false,
    starCore: { owner: 0, function: null },
    beacons: new Map(),
    transferMode: null,
    multiPlace: null,
    firstDiscount: {
      1: { mage: false, warrior: false },
      2: { mage: true,  warrior: true  },
    },
  };

  function initPieces() {
    const p = state.pieces;
    p.set(key(0,0),   { type:'base', owner:1, hp:1, maxHp:1 });
    p.set(key(1,0),   { type:'fort', owner:1, hp:3, maxHp:3 });
    p.set(key(0,1),   { type:'fort', owner:1, hp:3, maxHp:3 });
    p.set(key(1,1),   { type:'fort', owner:1, hp:3, maxHp:3 });

    p.set(key(14,14), { type:'base', owner:2, hp:1, maxHp:1 });
    p.set(key(13,14), { type:'fort', owner:2, hp:3, maxHp:3 });
    p.set(key(14,13), { type:'fort', owner:2, hp:3, maxHp:3 });
    p.set(key(13,13), { type:'fort', owner:2, hp:3, maxHp:3 });
  }

  const roundRect = (x, y, w, h, r) => SL.roundRectCtx(ctx, x, y, w, h, r);

  function computeOwnerAround(col, row) {
    let p1 = 0, p2 = 0;
    for (const n of getAdjacent(col, row)) {
      const p = state.pieces.get(key(n.col, n.row));
      if (!p) continue;
      if (p.owner === 1) p1++;
      else if (p.owner === 2) p2++;
    }
    if (p1 > p2) return 1;
    if (p2 > p1) return 2;
    return 0;
  }

  function updateStarCoreOwner() {
    const newOwner = computeOwnerAround(CORE_POS.col, CORE_POS.row);
    if (newOwner !== state.starCore.owner) {
      state.starCore.owner = newOwner;
      state.starCore.function = null;
    }
  }
  function updateBeacons() {
    for (const bp of BEACONS) {
      state.beacons.set(key(bp.col, bp.row), computeOwnerAround(bp.col, bp.row));
    }
  }
  function updateAllStructures() { updateStarCoreOwner(); updateBeacons(); }
  function countBeaconsOwnedBy(player) {
    let c = 0;
    for (const bp of BEACONS) if (state.beacons.get(key(bp.col, bp.row)) === player) c++;
    return c;
  }

  function getEffectiveCost(type, player) {
    if (state.firstDiscount[player][type]) {
      return VOUCHER_PRICES[type];
    }
    return PIECE_TYPES[type].cost;
  }


  const TINTS = {
    base1: C.base1Tint, base2: C.base2Tint,
    fort1: C.fort1Tint, fort2: C.fort2Tint,
    core: C.coreTint, beacon: C.beaconTint, empty: C.empty,
  };

  function drawFloor(col, row) {
    const r = cellRect(col, row);
    const t = cellType(col, row);
    ctx.fillStyle = TINTS[t];
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = C.grid;
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);

    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    if (t === 'core') drawStarCoreCell(r, cx, cy);
    else if (t === 'beacon') drawBeaconCell(r, cx, cy, col, row);
  }

  function drawStarCoreCell(r, cx, cy) {
    const owner = state.starCore.owner;
    const color = owner === 1 ? C.coreP1 : owner === 2 ? C.coreP2 : C.coreNeutral;
    const pulse = 1 + 0.08 * Math.sin(performance.now() / 400);
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 16 * pulse;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 11); ctx.lineTo(cx + 11, cy);
    ctx.lineTo(cx, cy + 11); ctx.lineTo(cx - 11, cy);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 4.5); ctx.lineTo(cx + 4.5, cy);
    ctx.lineTo(cx, cy + 4.5); ctx.lineTo(cx - 4.5, cy);
    ctx.closePath(); ctx.fill();

    let p1 = 0, p2 = 0;
    for (const n of getAdjacent(CORE_POS.col, CORE_POS.row)) {
      const p = state.pieces.get(key(n.col, n.row));
      if (!p) continue;
      if (p.owner === 1) p1++;
      else if (p.owner === 2) p2++;
    }
    drawCountBadge(r.x + 9, r.y + 9, p1, '#3b82f6');
    drawCountBadge(r.x + r.w - 9, r.y + 9, p2, '#ef4444');

    if (state.starCore.function) {
      const fn = CORE_FUNCTIONS[state.starCore.function];
      const bx = cx, by = r.y + r.h - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = '900 11px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(fn.icon, bx, by + 0.5);
    }
  }

  function drawBeaconCell(r, cx, cy, col, row) {
    const owner = state.beacons.get(key(col, row)) ?? 0;
    const color = owner === 1 ? C.coreP1 : owner === 2 ? C.coreP2 : C.beaconMark;
    ctx.save();
    if (owner !== 0) { ctx.shadowColor = color; ctx.shadowBlur = 10; }
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    if (owner === 0) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();
    }

    let p1 = 0, p2 = 0;
    for (const n of getAdjacent(col, row)) {
      const p = state.pieces.get(key(n.col, n.row));
      if (!p) continue;
      if (p.owner === 1) p1++;
      else if (p.owner === 2) p2++;
    }
    drawCountBadge(r.x + 9, r.y + 9, p1, '#3b82f6');
    drawCountBadge(r.x + r.w - 9, r.y + 9, p2, '#ef4444');
  }

  function drawCountBadge(cx, cy, count, color) {
    const r = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = '900 10px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(count), cx, cy + 0.5);
  }

  function drawPieceVisual(col, row, piece, alpha = 1) {
    const r = cellRect(col, row);
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    const size = r.w - 8;
    const half = size / 2;

    ctx.save();
    ctx.globalAlpha = alpha;
    SL.paintPieceBody(ctx, cx, cy, size, piece.type, piece.owner);

    const hpStr = String(Math.max(0, piece.hp));
    const digits = hpStr.length;
    const fontSize = digits <= 1 ? 12 : digits === 2 ? 11 : 10;
    ctx.font = `900 ${fontSize}px ui-sans-serif, system-ui, sans-serif`;
    const textW = ctx.measureText(hpStr).width;

    const padX = 5, badgeH = 16;
    const badgeW = Math.max(badgeH, textW + padX * 2);
    const radius = badgeH / 2;
    const badgeX = cx + half - badgeW - 1;
    const badgeY = cy + half - badgeH - 1;

    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    roundRect(badgeX, badgeY, badgeW, badgeH, radius); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    roundRect(badgeX, badgeY, badgeW, badgeH, radius); ctx.stroke();

    const ratio = Math.max(0, piece.hp) / piece.maxHp;
    ctx.fillStyle = ratio > 0.6 ? '#ffffff' : ratio > 0.3 ? '#fde68a' : '#fca5a5';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(hpStr, badgeX + badgeW / 2, badgeY + badgeH / 2 + 0.5);

    ctx.restore();
  }
  function drawPiece(col, row, piece) { drawPieceVisual(col, row, piece, 1); }

  function drawShootRays(ctrl) {
    const c0 = cellCenter(ctrl.col, ctrl.row);
    for (const d of DIRS8) {
      const nc = ctrl.col + d.dc, nr = ctrl.row + d.dr;
      if (!inBounds(nc, nr)) continue;
      const c1 = cellCenter(nc, nr);
      const hit = findTargetAlongRay(ctrl.col, ctrl.row, d.dc, d.dr);
      const color = hit ? C.aim : C.aimEmpty;
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = hit ? 0.9 : 0.35;
      ctx.lineWidth = hit ? 3 : 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.stroke();
      ctx.restore();
      const ang = Math.atan2(c1.y - c0.y, c1.x - c0.x);
      ctx.save();
      ctx.translate(c1.x, c1.y); ctx.rotate(ang);
      ctx.fillStyle = color; ctx.globalAlpha = hit ? 1 : 0.5;
      ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(-5, -9); ctx.lineTo(-5, 9);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
  }

  // ★ 炮弹瞄准（星炮 / 无人机通用，style 决定颜色）
  function drawShellRays(ctrl, style) {
    const isDrone = style === 'drone';
    const color = isDrone ? C.droneShell : C.shell;
    const c0 = cellCenter(ctrl.col, ctrl.row);
    for (const d of DIRS8) {
      const nc = ctrl.col + d.dc, nr = ctrl.row + d.dr;
      if (!inBounds(nc, nr)) continue;
      const c1 = cellCenter(nc, nr);
      const impact = findShellImpact(ctrl.col, ctrl.row, d.dc, d.dr);
      ctx.save();
      ctx.strokeStyle = color; ctx.globalAlpha = 0.75;
      ctx.lineWidth = 2.5; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.stroke();
      ctx.restore();
      const ang = Math.atan2(c1.y - c0.y, c1.x - c0.x);
      ctx.save();
      ctx.translate(c1.x, c1.y); ctx.rotate(ang);
      ctx.fillStyle = color; ctx.globalAlpha = 0.95;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -10); ctx.lineTo(-6, 10);
      ctx.closePath(); ctx.fill(); ctx.restore();
      if (impact) {
        const ic = cellCenter(impact.col, impact.row);
        if (impact.type === 'absorb') {
          ctx.save();
          ctx.globalAlpha = 0.7;
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          const sz = 8;
          ctx.beginPath();
          ctx.moveTo(ic.x - sz, ic.y - sz); ctx.lineTo(ic.x + sz, ic.y + sz);
          ctx.moveTo(ic.x + sz, ic.y - sz); ctx.lineTo(ic.x - sz, ic.y + sz);
          ctx.stroke();
          ctx.restore();
        } else {
          ctx.save();
          ctx.globalAlpha = 0.28; ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(ic.x, ic.y, CELL * 1.5, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          ctx.save();
          ctx.globalAlpha = 0.85; ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(ic.x, ic.y, 4, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
      }
    }
  }

  function drawAttackHighlights(ctrl) {
    for (const n of getAdjacent(ctrl.col, ctrl.row)) {
      const r = cellRect(n.col, n.row);
      const target = state.pieces.get(key(n.col, n.row));
      const isEnemy = target && target.owner !== state.turn;
      ctx.fillStyle = isEnemy ? 'rgba(239,68,68,0.30)' : 'rgba(239,68,68,0.06)';
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = isEnemy ? C.attack : 'rgba(239,68,68,0.25)';
      ctx.lineWidth = isEnemy ? 2.5 : 1;
      ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
    }
  }

  function drawMoveHighlights(ctrl) {
    const targets = getMoveTargets(ctrl.col, ctrl.row);
    for (const t of targets) {
      const r = cellRect(t.col, t.row);
      ctx.fillStyle = 'rgba(34,197,94,0.20)';
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = C.valid; ctx.lineWidth = 1.8;
      ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
      const bx = r.x + 12, by = r.y + 12;
      ctx.fillStyle = 'rgba(34,197,94,0.9)';
      ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '900 11px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.step, bx, by + 0.5);
    }
  }

  // ★ 无人机移动高亮（和普通移动相同逻辑，只是数据源不同）
  function drawDroneMoveHighlights(ctrl) {
    const targets = getDroneMoveTargets(ctrl.col, ctrl.row);
    for (const t of targets) {
      const r = cellRect(t.col, t.row);
      ctx.fillStyle = 'rgba(34,197,94,0.20)';
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = C.valid; ctx.lineWidth = 1.8;
      ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
      const bx = r.x + 12, by = r.y + 12;
      ctx.fillStyle = 'rgba(34,197,94,0.9)';
      ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '900 11px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.step, bx, by + 0.5);
    }
  }

  function drawRaidHighlights(ctrl) {
    const targets = getRaidTargets(ctrl.col, ctrl.row);
    const range = PIECE_TYPES.ranger.raidRange;
    for (let dc = -range; dc <= range; dc++) {
      for (let dr = -range; dr <= range; dr++) {
        const c = ctrl.col + dc, r = ctrl.row + dr;
        if (!inBounds(c, r)) continue;
        if (dc === 0 && dr === 0) continue;
        const rect = cellRect(c, r);
        ctx.save();
        ctx.strokeStyle = 'rgba(251,146,60,0.20)';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(rect.x + 5.5, rect.y + 5.5, rect.w - 11, rect.h - 11);
        ctx.restore();
      }
    }

    for (const t of targets) {
      const r = cellRect(t.col, t.row);
      let hitCount = 0;
      for (const n of getAdjacent(t.col, t.row)) {
        const p = state.pieces.get(key(n.col, n.row));
        if (p && p.owner !== state.turn) hitCount++;
      }
      const hasHit = hitCount > 0;

      ctx.fillStyle = hasHit ? 'rgba(251,146,60,0.28)' : 'rgba(251,146,60,0.10)';
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = hasHit ? C.raid : 'rgba(251,146,60,0.55)';
      ctx.lineWidth = hasHit ? 2.4 : 1.2;
      ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);

      if (hitCount > 0) {
        const bx = r.x + 12, by = r.y + 12;
        ctx.fillStyle = 'rgba(251,146,60,0.95)';
        ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '900 11px ui-sans-serif, system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(hitCount, bx, by + 0.5);
      }
    }
  }

  // ★ 骑兵冲锋高亮
  function drawChargeHighlights(ctrl) {
    const def = PIECE_TYPES[ctrl.type];
    const targets = getChargeTargets(ctrl.col, ctrl.row);
    const c0 = cellCenter(ctrl.col, ctrl.row);

    // 4 方向射线
    for (const d of DIRS4) {
      for (let step = 1; step <= def.chargeRange; step++) {
        const c = ctrl.col + d.dc * step, r = ctrl.row + d.dr * step;
        if (!inBounds(c, r)) break;
        const c1 = cellCenter(c, r);
        ctx.save();
        ctx.strokeStyle = 'rgba(244,63,94,0.22)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(c0.x, c0.y);
        ctx.lineTo(c1.x, c1.y);
        ctx.stroke();
        ctx.restore();
        if (state.pieces.has(key(c, r))) break;
      }
    }

    // 收集会被撞的所有敌人
    const enemiesHit = new Set();

    // 目标格
    for (const t of targets) {
      const r = cellRect(t.col, t.row);
      const hitCount = t.hitEnemies.length;
      const hasHit = hitCount > 0;

      for (const e of t.hitEnemies) enemiesHit.add(key(e.col, e.row));

      ctx.fillStyle = hasHit ? 'rgba(244,63,94,0.24)' : 'rgba(34,197,94,0.20)';
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = hasHit ? C.charge : C.valid;
      ctx.lineWidth = hasHit ? 2.4 : 1.8;
      ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);

      if (hitCount > 0) {
        const bx = r.x + 12, by = r.y + 12;
        ctx.fillStyle = 'rgba(244,63,94,0.95)';
        ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '900 11px ui-sans-serif, system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(hitCount, bx, by + 0.5);
      }
    }

    // 被撞的敌人加红圈
    for (const ek of enemiesHit) {
      const [c, r] = ek.split(',').map(Number);
      const rect = cellRect(c, r);
      ctx.save();
      ctx.strokeStyle = C.charge;
      ctx.lineWidth = 3;
      ctx.shadowColor = C.charge;
      ctx.shadowBlur = 10;
      ctx.strokeRect(rect.x + 2, rect.y + 2, rect.w - 4, rect.h - 4);
      ctx.restore();
    }
  }

  function drawSpawnHighlights(ctrl) {
    const targets = getSpawnTargets(ctrl.col, ctrl.row);
    for (const t of targets) {
      const r = cellRect(t.col, t.row);
      ctx.fillStyle = 'rgba(168,85,247,0.22)';
      ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
      ctx.strokeStyle = C.spawn; ctx.lineWidth = 2;
      ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
      ctx.save();
      ctx.translate(r.x + r.w/2, r.y + r.h/2);
      ctx.globalAlpha = 0.4;
      SL.ICONS.iconWarrior(ctx, r.w * 0.22);
      ctx.restore();
    }
  }

  function drawTransferHighlights() {
    const tm = state.transferMode;
    if (!tm) return;
    if (tm.step === 'piece') {
      for (const [k, piece] of state.pieces) {
        if (piece.owner !== state.turn) continue;
        const [col, row] = k.split(',').map(Number);
        const r = cellRect(col, row);
        ctx.fillStyle = 'rgba(168,85,247,0.20)';
        ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
        ctx.strokeStyle = C.spawn; ctx.lineWidth = 2;
        ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
      }
      for (let dc = -2; dc <= 2; dc++) {
        for (let dr = -2; dr <= 2; dr++) {
          const c = CORE_POS.col + dc, r2 = CORE_POS.row + dr;
          if (!inBounds(c, r2)) continue;
          if (c === CORE_POS.col && r2 === CORE_POS.row) continue;
          const r = cellRect(c, r2);
          ctx.strokeStyle = 'rgba(168,85,247,0.35)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.strokeRect(r.x + 5.5, r.y + 5.5, r.w - 11, r.h - 11);
          ctx.setLineDash([]);
        }
      }
    } else if (tm.step === 'target' && tm.source) {
      const sr = cellRect(tm.source.col, tm.source.row);
      ctx.strokeStyle = C.select; ctx.lineWidth = 2.5;
      ctx.strokeRect(sr.x + 2, sr.y + 2, sr.w - 4, sr.h - 4);
      for (let dc = -2; dc <= 2; dc++) {
        for (let dr = -2; dr <= 2; dr++) {
          const c = CORE_POS.col + dc, r2 = CORE_POS.row + dr;
          if (!inBounds(c, r2)) continue;
          if (c === CORE_POS.col && r2 === CORE_POS.row) continue;
          if (c === tm.source.col && r2 === tm.source.row) continue;
          if (state.pieces.has(key(c, r2))) continue;
          const t = cellType(c, r2);
          if (t === 'core' || t === 'beacon') continue;
          const r = cellRect(c, r2);
          ctx.fillStyle = 'rgba(168,85,247,0.24)';
          ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
          ctx.strokeStyle = C.spawn; ctx.lineWidth = 2;
          ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
        }
      }
    }
  }

  // ★ 炮弹飞行（按 style 区分颜色）
  function drawShell(s) {
    const color = s.style === 'drone' ? C.droneShell : C.shell;
    const core = s.style === 'drone' ? C.droneShellCore : C.shellCore;
    ctx.save();
    ctx.shadowColor = color; ctx.shadowBlur = 18;
    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 12);
    grad.addColorStop(0.0, core);
    grad.addColorStop(0.4, color);
    grad.addColorStop(1.0, 'rgba(251,146,60,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawExplosion(e) {
    const r = cellRect(e.col, e.row);
    const cx = r.x + r.w/2, cy = r.y + r.h/2;
    const p = Math.min(1, e.t / e.dur);
    const alpha = 1 - p;
    const radius = CELL * (0.35 + p * 1.5);

    const hot = e.style === 'drone' ? C.droneExplosionHot : C.explosionHot;
    const mid = e.style === 'drone' ? C.droneExplosionMid : C.explosionMid;
    const edge = e.style === 'drone' ? C.droneExplosionEdge : C.explosionEdge;
    const ringColor = e.style === 'drone' ? C.droneShell : C.shell;

    ctx.save();
    ctx.globalAlpha = alpha * 0.9;
    const grad = ctx.createRadialGradient(cx, cy, radius * 0.15, cx, cy, radius);
    grad.addColorStop(0.00, hot);
    grad.addColorStop(0.35, mid);
    grad.addColorStop(1.00, edge);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    const coreR = CELL * 0.55 * (1 - p);
    if (coreR > 0.5) {
      ctx.fillStyle = `rgba(255, 255, 230, ${alpha})`;
      ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.fill();
    }
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    ctx.strokeStyle = ringColor;
    ctx.lineWidth = 3 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, radius * 0.9, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  function draw() {
    // 每帧重置变换：尺寸变化时 canvas.width 被赋值会清空上下文状态，
    // 这里统一到一处重建，避免"缩放叠加两次"。
    if (ctx.setTransform) ctx.setTransform(CFG.DPR * viewScale, 0, 0, CFG.DPR * viewScale, 0, 0);
    ctx.clearRect(0, 0, SIZE, SIZE);
    for (let row = 0; row < CFG.N; row++)
      for (let col = 0; col < CFG.N; col++)
        drawFloor(col, row);

    let placeableSet = null;
    if (state.placing || state.multiPlace) {
      const cells = getPlaceableCells(state.turn);
      placeableSet = new Set(cells.map(c => key(c.col, c.row)));
      for (const { col, row } of cells) {
        const r = cellRect(col, row);
        ctx.fillStyle = 'rgba(34,197,94,0.18)';
        ctx.fillRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6);
        ctx.strokeStyle = C.valid; ctx.lineWidth = 1.5;
        ctx.strokeRect(r.x + 3.5, r.y + 3.5, r.w - 7, r.h - 7);
      }
    }

    if (state.controlled && state.controlAction === 'shoot') {
      drawShootRays(state.controlled);
    } else if (state.controlled && state.controlAction === 'shootCannon') {
      drawShellRays(state.controlled, 'cannon');
    } else if (state.controlled && state.controlAction === 'droneShoot') {
      drawShellRays(state.controlled, 'drone');
    } else if (state.controlled && state.controlAction === 'attack') {
      drawAttackHighlights(state.controlled);
    } else if (state.controlled && state.controlAction === 'move') {
      drawMoveHighlights(state.controlled);
    } else if (state.controlled && state.controlAction === 'droneMove') {
      drawDroneMoveHighlights(state.controlled);
    } else if (state.controlled && state.controlAction === 'spawn') {
      drawSpawnHighlights(state.controlled);
    } else if (state.controlled && state.controlAction === 'raid') {
      drawRaidHighlights(state.controlled);
    } else if (state.controlled && state.controlAction === 'charge') {
      drawChargeHighlights(state.controlled);
    }

    if (state.transferMode) drawTransferHighlights();

    for (const [k, piece] of state.pieces) {
      const [col, row] = k.split(',').map(Number);
      drawPiece(col, row, piece);
    }

    if (placeableSet && state.hover &&
        placeableSet.has(key(state.hover.col, state.hover.row))) {
      if (state.placing) {
        const def = PIECE_TYPES[state.placing];
        drawPieceVisual(state.hover.col, state.hover.row, {
          type: state.placing, owner: state.turn,
          hp: def.maxHp, maxHp: def.maxHp,
        }, 0.68);
      } else if (state.multiPlace) {
        const def = PIECE_TYPES[state.multiPlace.placeType];
        drawPieceVisual(state.hover.col, state.hover.row, {
          type: state.multiPlace.placeType, owner: state.turn,
          hp: def.maxHp, maxHp: def.maxHp,
        }, 0.68);
      }
    }

    if (state.controlled) {
      const r = cellRect(state.controlled.col, state.controlled.row);
      ctx.strokeStyle = C.select; ctx.lineWidth = 2.5;
      ctx.strokeRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
    }
    if (state.hover) {
      const r = cellRect(state.hover.col, state.hover.row);
      ctx.strokeStyle = C.hover; ctx.lineWidth = 2;
      ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    }

    for (const a of state.arrows) {
      const ang = Math.atan2(a.ty - a.y0, a.tx - a.x0);
      ctx.save();
      ctx.translate(a.x, a.y); ctx.rotate(ang);
      ctx.shadowColor = a.owner === 1 ? '#60a5fa' : '#f87171';
      ctx.shadowBlur = 8;
      ctx.fillStyle = a.owner === 1 ? '#bfdbfe' : '#fecaca';
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-7, -6); ctx.lineTo(-3, 0); ctx.lineTo(-7, 6);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    for (const s of state.shells) drawShell(s);
    for (const e of state.explosions) drawExplosion(e);
  }

  function getAdjacent(col, row) {
    const out = [];
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (dc === 0 && dr === 0) continue;
        const c = col + dc, r = row + dr;
        if (inBounds(c, r)) out.push({ col: c, row: r });
      }
    }
    return out;
  }

  function getPlaceableCells(player) {
    const set = new Set();
    for (const [k, piece] of state.pieces) {
      if (piece.owner !== player) continue;
      const [col, row] = k.split(',').map(Number);
      for (const n of getAdjacent(col, row)) {
        const t = cellType(n.col, n.row);
        if (t === 'core' || t === 'beacon') continue;
        if (!state.pieces.has(key(n.col, n.row))) set.add(key(n.col, n.row));
      }
    }
    return [...set].map(k => {
      const [col, row] = k.split(',').map(Number);
      return { col, row };
    });
  }

  // 标准移动（勇士用）
  function getMoveTargets(col, row) {
    const piece = state.pieces.get(key(col, row));
    if (!piece) return [];
    const def = PIECE_TYPES[piece.type];
    if (!def.move) return [];
    const dirs = def.move.dirs === 'all8' ? DIRS8 : DIRS4;
    const range = def.move.range;

    const out = [];
    for (const d of dirs) {
      for (let step = 1; step <= range; step++) {
        const c = col + d.dc * step, r = row + d.dr * step;
        if (!inBounds(c, r)) break;
        if (state.pieces.has(key(c, r))) break;
        const t = cellType(c, r);
        if (t === 'core' || t === 'beacon') break;
        out.push({ col: c, row: r, step });
      }
    }
    return out;
  }

  // ★ 无人机移动：4 方向 3 格 + 斜向 2 格
  function getDroneMoveTargets(col, row) {
    const piece = state.pieces.get(key(col, row));
    if (!piece) return [];
    const def = PIECE_TYPES[piece.type];
    if (def.kind !== 'drone') return [];

    const out = [];
    // 4 方向 3 格
    for (const d of DIRS4) {
      for (let step = 1; step <= def.moveOrthoRange; step++) {
        const c = col + d.dc * step, r = row + d.dr * step;
        if (!inBounds(c, r)) break;
        if (state.pieces.has(key(c, r))) break;
        const t = cellType(c, r);
        if (t === 'core' || t === 'beacon') break;
        out.push({ col: c, row: r, step });
      }
    }
    // 斜向 2 格
    for (const d of DIAG4) {
      for (let step = 1; step <= def.moveDiagRange; step++) {
        const c = col + d.dc * step, r = row + d.dr * step;
        if (!inBounds(c, r)) break;
        if (state.pieces.has(key(c, r))) break;
        const t = cellType(c, r);
        if (t === 'core' || t === 'beacon') break;
        out.push({ col: c, row: r, step });
      }
    }
    return out;
  }

  // ★ 骑兵冲锋目标
  function getChargeTargets(col, row) {
    const piece = state.pieces.get(key(col, row));
    if (!piece) return [];
    const def = PIECE_TYPES[piece.type];
    if (def.kind !== 'cavalry') return [];
    const range = def.chargeRange;

    const out = [];
    for (const d of DIRS4) {
      const enemiesAlongPath = [];
      for (let step = 1; step <= range; step++) {
        const c = col + d.dc * step, r = row + d.dr * step;
        if (!inBounds(c, r)) break;
        const t = cellType(c, r);
        if (t === 'core' || t === 'beacon') break;

        const target = state.pieces.get(key(c, r));
        if (target) {
          if (target.owner === piece.owner) break;   // 己方棋子阻挡
          // 敌方棋子 → 穿过
          enemiesAlongPath.push({ col: c, row: r });
        } else {
          // 空格 → 合法落点
          out.push({
            col: c, row: r, step,
            hitEnemies: [...enemiesAlongPath],
            dc: d.dc, dr: d.dr,
          });
        }
      }
    }
    return out;
  }

  function getSpawnTargets(col, row) {
    const out = [];
    for (const n of getAdjacent(col, row)) {
      if (state.pieces.has(key(n.col, n.row))) continue;
      const t = cellType(n.col, n.row);
      if (t === 'core' || t === 'beacon') continue;
      out.push(n);
    }
    return out;
  }

  function getRaidTargets(col, row) {
    const piece = state.pieces.get(key(col, row));
    if (!piece) return [];
    const def = PIECE_TYPES[piece.type];
    if (!def.raidRange) return [];
    const range = def.raidRange;

    const out = [];
    for (let dc = -range; dc <= range; dc++) {
      for (let dr = -range; dr <= range; dr++) {
        if (dc === 0 && dr === 0) continue;
        const c = col + dc, r = row + dr;
        if (!inBounds(c, r)) continue;
        if (state.pieces.has(key(c, r))) continue;
        const t = cellType(c, r);
        if (t === 'core' || t === 'beacon') continue;
        out.push({ col: c, row: r });
      }
    }
    return out;
  }

  function getTransferTargets() {
    const out = [];
    for (let dc = -2; dc <= 2; dc++) {
      for (let dr = -2; dr <= 2; dr++) {
        const c = CORE_POS.col + dc, r = CORE_POS.row + dr;
        if (!inBounds(c, r)) continue;
        if (c === CORE_POS.col && r === CORE_POS.row) continue;
        if (state.pieces.has(key(c, r))) continue;
        const t = cellType(c, r);
        if (t === 'core' || t === 'beacon') continue;
        out.push({ col: c, row: r });
      }
    }
    return out;
  }

  // 箭矢射线：跳过铁丝网
  function findTargetAlongRay(col, row, dc, dr) {
    let c = col + dc, r = row + dr;
    while (inBounds(c, r)) {
      const piece = state.pieces.get(key(c, r));
      if (piece) {
        if (piece.type === 'barbedwire') {
          c += dc; r += dr;
          continue;
        }
        return { col: c, row: r, isPiece: true };
      }
      if (cellType(c, r) === 'core') return { col: c, row: r, isPiece: false };
      c += dc; r += dr;
    }
    return null;
  }

  // 炮弹射线：铁丝网 = absorb
  function findShellImpact(col, row, dc, dr) {
    let c = col + dc, r = row + dr;
    let last = null;
    while (inBounds(c, r)) {
      last = { col: c, row: r };
      const piece = state.pieces.get(key(c, r));
      if (piece) {
        if (piece.type === 'barbedwire') {
          return { col: c, row: r, type: 'absorb' };
        }
        return { col: c, row: r, type: 'piece' };
      }
      const t = cellType(c, r);
      if (t === 'core')   return { col: c, row: r, type: 'core' };
      if (t === 'beacon') return { col: c, row: r, type: 'beacon' };
      c += dc; r += dr;
    }
    if (last) return { col: last.col, row: last.row, type: 'edge' };
    return { col, row, type: 'edge' };
  }

  function shakeCanvas(intensity = 7, duration = 280) {
    const start = performance.now();
    function tick() {
      const elapsed = performance.now() - start;
      if (elapsed > duration) { canvas.style.transform = ''; return; }
      const k = 1 - elapsed / duration;
      const dx = (Math.random() - 0.5) * intensity * k;
      const dy = (Math.random() - 0.5) * intensity * k;
      canvas.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;
      requestAnimationFrame(tick);
    }
    tick();
  }

  const bannerBox   = document.getElementById('bannerContent');
  const bannerTitle = document.getElementById('bannerTitle');
  const bannerSub   = document.getElementById('bannerSub');

  function showTurnBanner(player, gained, extras) {
    bannerTitle.textContent = `玩家 ${player} 回合`;
    bannerTitle.classList.toggle('p2', player === 2);
    bannerBox.style.borderColor = player === 1 ? '#3b82f6' : '#ef4444';
    bannerBox.style.boxShadow = player === 1
      ? '0 0 60px rgba(59,130,246,0.5)'
      : '0 0 60px rgba(239,68,68,0.5)';

    bannerSub.classList.remove('beacon');
    const parts = [];
    if (gained > 0) parts.push(`+${gained} 陨石`);
    if (extras && extras.coreYield) parts.push('星核收益生效');
    if (extras && extras.beaconCount > 0) {
      parts.push(`信标 ${extras.beaconCount} · 伤害+1概率 ${extras.beaconChance}`);
    }
    if (extras && extras.activeVouchers && extras.activeVouchers.length > 0) {
      parts.push(extras.activeVouchers.map(v => `✦ ${v}`).join(' '));
    }

    if (parts.length > 0) {
      bannerSub.textContent = parts.join(' · ');
      bannerSub.classList.add('show');
      if (extras && extras.beaconCount > 0) bannerSub.classList.add('beacon');
    } else {
      bannerSub.textContent = '';
      bannerSub.classList.remove('show');
    }

    bannerBox.classList.remove('play');
    void bannerBox.offsetWidth;
    bannerBox.classList.add('play');
  }

  function dealDamage(piece, baseAmount, attacker = state.turn) {
    const defender = piece.owner;

    let reduction = 0;
    if (state.starCore.owner === defender &&
        state.starCore.function === 'defense') reduction = 1;

    let bonus = 0;
    if (attacker !== defender) {
      const bc = countBeaconsOwnedBy(attacker);
      const buff = BEACON_BUFF[bc];
      if (buff && Math.random() < buff.chance) bonus = 1;
    }

    const amount = Math.max(1, baseAmount + bonus - reduction);
    piece.hp -= amount;
    return amount;
  }

  function getActiveVouchers(player) {
    const out = [];
    for (const [type, available] of Object.entries(state.firstDiscount[player])) {
      if (available) out.push(VOUCHER_LABELS[type]);
    }
    return out;
  }

  function startTurn(player) {
    let gained = 0;
    for (const [, piece] of state.pieces) {
      if (piece.owner !== player) continue;
      const def = PIECE_TYPES[piece.type];
      if (def.kind === 'producer') {
        state.meteors[player] += def.produce;
        gained += def.produce;
      }
    }
    const extras = {
      coreYield: false,
      beaconCount: 0,
      beaconChance: '',
      activeVouchers: getActiveVouchers(player),
    };
    if (state.starCore.owner === player && state.starCore.function === 'yield') {
      const boosted = Math.floor(gained * 1.17);
      const bonus = boosted - gained;
      if (bonus > 0) {
        state.meteors[player] += bonus;
        gained = boosted;
        extras.coreYield = true;
      }
    }
    const bc = countBeaconsOwnedBy(player);
    if (bc > 0) {
      extras.beaconCount = bc;
      extras.beaconChance = BEACON_BUFF[bc].name;
    }
    return { gained, extras };
  }

  function resetControl() {
    state.controlled = null;
    state.controlAction = null;
    refreshActionMenu();
  }
  function resetTransfer() { state.transferMode = null; }

  function endTurn() {
    if (state.gameOver) return;
    state.turn = 3 - state.turn;
    state.placing = null;
    state.openCategory = null;
    state.multiPlace = null;
    resetControl();
    resetTransfer();

    const result = startTurn(state.turn);
    updateHUD();
    showTurnBanner(state.turn, result.gained, result.extras);
  }

  function doPlace(type, col, row) {
    const def = PIECE_TYPES[type];
    if (!def || def.cost === undefined) return false;

    const cost = getEffectiveCost(type, state.turn);
    if (state.meteors[state.turn] < cost) return false;
    if (state.pieces.has(key(col, row))) return false;
    const legal = getPlaceableCells(state.turn).some(c => c.col === col && c.row === row);
    if (!legal) return false;

    state.meteors[state.turn] -= cost;

    if (state.firstDiscount[state.turn][type]) {
      state.firstDiscount[state.turn][type] = false;
    }

    state.pieces.set(key(col, row), {
      type, owner: state.turn, hp: def.maxHp, maxHp: def.maxHp,
    });
    updateAllStructures();
    endTurn();
    return true;
  }

  function startMultiPlace(type) {
    const def = PIECE_TYPES[type];
    if (!def || def.kind !== 'multiplace') return false;
    const cost = def.cost;
    if (state.meteors[state.turn] < cost) return false;

    state.meteors[state.turn] -= cost;
    state.multiPlace = {
      sourceType: type,
      placeType: def.placeType,
      remaining: def.placeCount,
      placedKeys: [],
    };
    state.placing = null;
    state.openCategory = null;
    resetControl();
    refreshBottomBar();
    updateHUD();
    draw();
    return true;
  }

  function cancelMultiPlace() {
    if (!state.multiPlace) return;
    const mp = state.multiPlace;
    for (const k of mp.placedKeys) {
      state.pieces.delete(k);
    }
    state.meteors[state.turn] += PIECE_TYPES[mp.sourceType].cost;
    state.multiPlace = null;
    updateAllStructures();
    refreshActionMenu();
    refreshBottomBar();
    updateHUD();
    draw();
  }

  function doShoot(col, row, dc, dr) {
    const piece = state.pieces.get(key(col, row));
    if (!piece || piece.owner !== state.turn) return false;
    const hit = findTargetAlongRay(col, row, dc, dr);
    const start = cellCenter(col, row);
    let end, target = null;
    if (hit) {
      end = cellCenter(hit.col, hit.row);
      if (hit.isPiece) target = { col: hit.col, row: hit.row };
    } else {
      let c = col, r = row;
      while (inBounds(c + dc, r + dr)) { c += dc; r += dr; }
      const outCol = c + dc, outRow = r + dr;
      end = { x: (outCol + 0.5) * CELL, y: (CFG.N - outRow - 0.5) * CELL };
    }
    const dist = Math.hypot(end.x - start.x, end.y - start.y);
    const dur = Math.max(0.12, dist / 1500);
    state.arrows.push({
      x0: start.x, y0: start.y, x: start.x, y: start.y,
      tx: end.x, ty: end.y, t: 0, dur, owner: piece.owner, target,
    });
    endTurn();
    return true;
  }

  // ★ 通用炮弹发射（星炮 / 无人机共用）
  function fireShell(col, row, dc, dr, style, centerDamage, adjacentDamage) {
    const piece = state.pieces.get(key(col, row));
    if (!piece || piece.owner !== state.turn) return false;
    const impact = findShellImpact(col, row, dc, dr);
    const start = cellCenter(col, row);
    const end = cellCenter(impact.col, impact.row);
    const dist = Math.hypot(end.x - start.x, end.y - start.y);
    const dur = Math.max(0.18, dist / 900);
    state.shells.push({
      x0: start.x, y0: start.y, x: start.x, y: start.y,
      tx: end.x, ty: end.y, t: 0, dur, owner: piece.owner,
      impactCell: { col: impact.col, row: impact.row },
      absorbed: impact.type === 'absorb',
      style,
      centerDamage,
      adjacentDamage,
    });
    endTurn();
    return true;
  }

  function doShootCannon(col, row, dc, dr) {
    return fireShell(col, row, dc, dr, 'cannon', 7, 3);
  }

  function doDroneShoot(col, row, dc, dr) {
    const piece = state.pieces.get(key(col, row));
    if (!piece) return false;
    const def = PIECE_TYPES[piece.type];
    if (def.kind !== 'drone') return false;
    return fireShell(col, row, dc, dr, 'drone',
      def.shellCenterDamage, def.shellAdjacentDamage);
  }

  function doMeleeAttack(fromCol, fromRow, toCol, toRow) {
    const attacker = state.pieces.get(key(fromCol, fromRow));
    if (!attacker) return false;
    const target = state.pieces.get(key(toCol, toRow));
    if (!target) return false;
    if (target.owner === attacker.owner) return false;
    const dmg = PIECE_TYPES[attacker.type].attackDamage || 1;
    dealDamage(target, dmg);
    if (target.hp <= 0) {
      state.pieces.delete(key(toCol, toRow));
      updateAllStructures();
      if (target.type === 'base') gameOverEnd(target.owner === 1 ? 2 : 1);
    }
    endTurn();
    return true;
  }

  function doMove(fromCol, fromRow, toCol, toRow) {
    const piece = state.pieces.get(key(fromCol, fromRow));
    if (!piece) return false;
    state.pieces.delete(key(fromCol, fromRow));
    state.pieces.set(key(toCol, toRow), piece);
    updateAllStructures();
    endTurn();
    return true;
  }

  function doSpawn(fromCol, fromRow, toCol, toRow) {
    const mage = state.pieces.get(key(fromCol, fromRow));
    if (!mage) return false;
    const def = PIECE_TYPES[mage.type];
    if (!def.spawnType) return false;
    if (state.pieces.has(key(toCol, toRow))) return false;
    const spawned = PIECE_TYPES[def.spawnType];
    state.pieces.set(key(toCol, toRow), {
      type: def.spawnType, owner: mage.owner, hp: spawned.maxHp, maxHp: spawned.maxHp,
    });
    updateAllStructures();
    endTurn();
    return true;
  }

  function doRaid(fromCol, fromRow, toCol, toRow) {
    const piece = state.pieces.get(key(fromCol, fromRow));
    if (!piece || piece.owner !== state.turn) return false;
    const def = PIECE_TYPES[piece.type];
    if (!def.raidRange || !def.raidDamage) return false;

    if (Math.abs(toCol - fromCol) > def.raidRange) return false;
    if (Math.abs(toRow - fromRow) > def.raidRange) return false;
    if (toCol === fromCol && toRow === fromRow) return false;

    if (state.pieces.has(key(toCol, toRow))) return false;
    const t = cellType(toCol, toRow);
    if (t === 'core' || t === 'beacon') return false;

    state.pieces.delete(key(fromCol, fromRow));
    state.pieces.set(key(toCol, toRow), piece);

    const dmg = def.raidDamage;
    for (const n of getAdjacent(toCol, toRow)) {
      const target = state.pieces.get(key(n.col, n.row));
      if (!target) continue;
      if (target.owner === piece.owner) continue;

      dealDamage(target, dmg);
      if (target.hp <= 0) {
        state.pieces.delete(key(n.col, n.row));
        if (target.type === 'base') gameOverEnd(target.owner === 1 ? 2 : 1);
      }
    }

    updateAllStructures();
    endTurn();
    return true;
  }

  // ★ 骑兵冲锋
  function doCharge(fromCol, fromRow, toCol, toRow) {
    const piece = state.pieces.get(key(fromCol, fromRow));
    if (!piece || piece.owner !== state.turn) return false;
    const def = PIECE_TYPES[piece.type];
    if (def.kind !== 'cavalry') return false;

    const targets = getChargeTargets(fromCol, fromRow);
    const hit = targets.find(t => t.col === toCol && t.row === toRow);
    if (!hit) return false;

    // 对被穿过的敌人造成伤害
    for (const e of hit.hitEnemies) {
      if (state.gameOver) break;
      const enemy = state.pieces.get(key(e.col, e.row));
      if (!enemy) continue;
      dealDamage(enemy, def.chargeDamage);
      if (enemy.hp <= 0) {
        state.pieces.delete(key(e.col, e.row));
        if (enemy.type === 'base') gameOverEnd(enemy.owner === 1 ? 2 : 1);
      }
    }

    // 移动骑兵
    if (!state.gameOver) {
      state.pieces.delete(key(fromCol, fromRow));
      state.pieces.set(key(toCol, toRow), piece);
    }

    updateAllStructures();
    endTurn();
    return true;
  }

  function activateCoreFunction(fnName) {
    if (state.starCore.owner !== state.turn) return false;
    if (state.starCore.function === fnName) return false;
    const fn = CORE_FUNCTIONS[fnName];
    if (!fn) return false;
    if (fnName === 'transfer') {
      if (state.meteors[state.turn] < 40) return false;
      state.transferMode = { step: 'piece', source: null };
      state.openCategory = null;
      refreshBottomBar(); updateHUD(); draw();
      return true;
    }
    if (state.meteors[state.turn] < 10) return false;
    state.meteors[state.turn] -= 10;
    state.starCore.function = fnName;
    state.openCategory = null;
    refreshBottomBar(); updateHUD(); draw();
    return true;
  }

  function executeTransfer(fromCol, fromRow, toCol, toRow) {
    const piece = state.pieces.get(key(fromCol, fromRow));
    if (!piece || piece.owner !== state.turn) return false;
    if (state.pieces.has(key(toCol, toRow))) return false;
    if (Math.abs(toCol - CORE_POS.col) > 2 || Math.abs(toRow - CORE_POS.row) > 2) return false;
    const t = cellType(toCol, toRow);
    if (t === 'core' || t === 'beacon') return false;
    if (state.meteors[state.turn] < 40) return false;
    state.meteors[state.turn] -= 40;
    state.pieces.delete(key(fromCol, fromRow));
    state.pieces.set(key(toCol, toRow), piece);
    state.transferMode = null;
    updateAllStructures();
    endTurn();
    return true;
  }

  function applyAreaDamage(col, row, dmg, attacker) {
    if (state.gameOver) return;
    const p = state.pieces.get(key(col, row));
    if (!p) return;
    dealDamage(p, dmg, attacker);
    if (p.hp <= 0) {
      state.pieces.delete(key(col, row));
      updateAllStructures();
      if (p.type === 'base') gameOverEnd(p.owner === 1 ? 2 : 1);
    }
  }

  // ★ 爆炸：伤害参数化
  function doExplode(col, row, attacker, centerDmg = 7, adjacentDmg = 3, style = 'cannon') {
    state.explosions.push({ col, row, t: 0, dur: 0.6, style });
    shakeCanvas(7, 280);
    applyAreaDamage(col, row, centerDmg, attacker);
    for (const n of getAdjacent(col, row)) {
      applyAreaDamage(n.col, n.row, adjacentDmg, attacker);
    }
  }

  function applyArrowDamage(arrow) {
    if (!arrow.target) return;
    const k = key(arrow.target.col, arrow.target.row);
    const piece = state.pieces.get(k);
    if (!piece) return;
    dealDamage(piece, 1, arrow.owner);
    if (piece.hp <= 0) {
      state.pieces.delete(k);
      updateAllStructures();
      if (piece.type === 'base') gameOverEnd(piece.owner === 1 ? 2 : 1);
    }
  }

  function gameOverEnd(winner) {
    state.gameOver = true;
    document.getElementById('resultText').textContent = `玩家 ${winner} 胜利`;
    document.getElementById('overlay').classList.add('show');
  }

  function updateArrows(dt) {
    if (state.arrows.length === 0) return;
    for (let i = state.arrows.length - 1; i >= 0; i--) {
      const a = state.arrows[i];
      a.t += dt / a.dur;
      if (a.t >= 1) {
        applyArrowDamage(a);
        state.arrows.splice(i, 1);
      } else {
        a.x = a.x0 + (a.tx - a.x0) * a.t;
        a.y = a.y0 + (a.ty - a.y0) * a.t;
      }
    }
  }

  function updateShells(dt) {
    if (state.shells.length === 0) return;
    for (let i = state.shells.length - 1; i >= 0; i--) {
      const s = state.shells[i];
      s.t += dt / s.dur;
      if (s.t >= 1) {
        if (!s.absorbed) {
          doExplode(
            s.impactCell.col, s.impactCell.row, s.owner,
            s.centerDamage ?? 7, s.adjacentDamage ?? 3,
            s.style ?? 'cannon'
          );
        }
        state.shells.splice(i, 1);
      } else {
        s.x = s.x0 + (s.tx - s.x0) * s.t;
        s.y = s.y0 + (s.ty - s.y0) * s.t;
      }
    }
  }

  function updateExplosions(dt) {
    if (state.explosions.length === 0) return;
    for (let i = state.explosions.length - 1; i >= 0; i--) {
      const e = state.explosions[i];
      e.t += dt;
      if (e.t >= e.dur) state.explosions.splice(i, 1);
    }
  }

  // ==================== 信息弹窗 ====================
  const infoOverlay = document.getElementById('infoOverlay');
  const infoTitleEl = document.getElementById('infoTitle');
  const infoBodyEl = document.getElementById('infoBody');
  const infoHeaderIconEl = document.getElementById('infoHeaderIcon');

  const ICON_SVG_BEACON = `<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>`;
  const ICON_SVG_CORE = `<svg viewBox="0 0 16 16"><path d="M8 1 L15 8 L8 15 L1 8 Z" fill="currentColor"/></svg>`;

  function closeInfo() { infoOverlay.classList.remove('show', 'gold'); }
  document.getElementById('infoClose').addEventListener('click', closeInfo);
  infoOverlay.addEventListener('click', (e) => { if (e.target === infoOverlay) closeInfo(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeInfo(); });

  function showBeaconInfo(bp = null) {
    infoOverlay.classList.remove('gold');
    infoHeaderIconEl.innerHTML = ICON_SVG_BEACON;

    let headHtml = '';
    if (bp) {
      const owner = state.beacons.get(key(bp.col, bp.row)) ?? 0;
      const ownerColor = owner === 1 ? '#60a5fa' : owner === 2 ? '#f87171' : '#2dd4bf';
      const ownerText = owner === 0 ? '中立' : `玩家 ${owner}`;
      let p1 = 0, p2 = 0;
      for (const n of getAdjacent(bp.col, bp.row)) {
        const p = state.pieces.get(key(n.col, n.row));
        if (!p) continue;
        if (p.owner === 1) p1++;
        else if (p.owner === 2) p2++;
      }
      headHtml = `
        <div class="info-row">
          <span class="info-label">当前归属</span>
          <span class="info-value" style="color:${ownerColor}">${ownerText}</span>
        </div>
        <div class="info-row">
          <span class="info-label">周围 8 格势力</span>
          <span class="info-value">
            <span style="color:#60a5fa">P1 ${p1}</span>
            <span style="color:#6b6b8a"> vs </span>
            <span style="color:#f87171">P2 ${p2}</span>
          </span>
        </div>
      `;
    }

    const bc1 = countBeaconsOwnedBy(1);
    const bc2 = countBeaconsOwnedBy(2);

    infoTitleEl.textContent = '信标';
    infoBodyEl.innerHTML = `
      ${headHtml}
      <div class="info-row">

  function showCoreInfo() {
    infoOverlay.classList.add('gold');
    infoHeaderIconEl.innerHTML = ICON_SVG_CORE;

          <span style="color:#60a5fa">P1 ${p1}</span>

      <div class="info-section">
        <div class="info-section-title">占领规则</div>
        <div>周围 8 格中己方棋子数多于敌方时占领，相等时中立。归属变化时当前功能清空。</div>
      </div>

          <li><b>收益</b>：回合开始时占领方收获的陨石 × 1.17，向下取整</li>
          <li><b>强防</b>：对方对己方造成的所有伤害 −1（最低 1）</li>
          <li><b>转移</b>（激活 + 使用共 40 陨石 + 本回合）：将己方一个场上棋子移动到星核周围 5×5 区域中的一个空格</li>
