<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spartlle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden; background: #05050d;
    font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none; touch-action: none;
  }

  #starfield { position: fixed; inset: 0; display: block; z-index: 0; }
  .grid-overlay {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(96, 165, 250, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96, 165, 250, 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    pointer-events: none; z-index: 1;
  }
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.88) 100%);
    pointer-events: none; z-index: 1;
  }

  .menu {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8vh; padding: 20px;
  }

  .title-wrap { position: relative; display: inline-block; text-align: center; }

  .title {
    font-family: 'Michroma', 'Rajdhani', sans-serif;
    font-weight: 400;
    font-size: clamp(36px, 10vw, 100px);
    letter-spacing: 0.12em; line-height: 1; margin: 0;
    padding: 0 0.06em 0.04em 0.12em;

    background: linear-gradient(100deg, #cbd5e1 0%, #ffffff 25%, #ffffff 38%, #bae6fd 47%, #ffffff 56%, #ffffff 72%, #cbd5e1 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 6px rgba(125, 211, 252, 1)) drop-shadow(0 0 18px rgba(56, 189, 248, 0.85)) drop-shadow(0 0 44px rgba(2, 132, 199, 0.55));
    animation: titleSweep 3.6s linear infinite, titleIn 1.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }

  @keyframes titleSweep { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }
  @keyframes titleIn {
    0% { letter-spacing: 0.55em; opacity: 0; filter: blur(16px) drop-shadow(0 0 6px rgba(125,211,252,1)); }
    60% { opacity: 1; }
    100% { letter-spacing: 0.12em; opacity: 1; filter: blur(0) drop-shadow(0 0 6px rgba(125,211,252,1)) drop-shadow(0 0 18px rgba(56,189,248,0.85)); }
  }

  .title-rule {
    width: min(560px, 78vw); height: 1px; margin: 22px auto 0;
    background: linear-gradient(90deg, transparent 0%, rgba(34,211,238,0.8) 25%, rgba(125,211,252,1) 50%, rgba(34,211,238,0.8) 75%, transparent 100%);
    box-shadow: 0 0 8px rgba(34,211,238,0.8), 0 0 18px rgba(34,211,238,0.5);
    animation: rulePulse 2.8s ease-in-out infinite;
  }
  @keyframes rulePulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  .buttons {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; max-width: 320px;
  }

  .menu-btn {
    position: relative; padding: 14px 20px;
    font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 700;
    letter-spacing: 0.25em; text-indent: 0.25em;
    border-radius: 4px; cursor: pointer; transition: all 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
    background: linear-gradient(180deg, rgba(15,23,42,0.85) 0%, rgba(8,12,24,0.95) 100%);
    color: #94a3b8; border: 1px solid rgba(148,163,184,0.22); text-align: center; overflow: hidden; outline: none;
  }

  .menu-btn::before, .menu-btn::after {
    content: ''; position: absolute; top: 50%; width: 14px; height: 1px;
    background: var(--accent, #60a5fa); transform: translateY(-50%) scaleX(0); transition: transform 0.3s;
    box-shadow: 0 0 8px var(--accent, #60a5fa);
  }
  .menu-btn::before { left: 12px; }
  .menu-btn::after { right: 12px; }

  .menu-btn:hover::before, .menu-btn:hover::after { transform: translateY(-50%) scaleX(1); }

  .menu-btn:hover {
    color: #fff; border-color: var(--accent, #60a5fa); transform: translateY(-2px);
    box-shadow: 0 0 0 1px var(--accent, #60a5fa), 0 0 22px var(--accent-glow, rgba(96,165,250,0.5)), 0 8px 20px rgba(0,0,0,0.5);
  }

  .menu-btn[data-mode="adventure"] { --accent: #fbbf24; --accent-glow: rgba(251,191,36,0.55); }
  .menu-btn[data-mode="defense"] { --accent: #f87171; --accent-glow: rgba(248,113,113,0.55); }
  .menu-btn[data-mode="free"] { --accent: #60a5fa; --accent-glow: rgba(96,165,250,0.6); }
  .menu-btn[data-mode="codex"] { --accent: #a855f7; --accent-glow: rgba(168,85,247,0.6); }

  .toast {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%) translateY(24px);
    padding: 10px 24px; border-radius: 4px; background: rgba(8,12,24,0.96);
    border: 1px solid rgba(96,165,250,0.4); color: #e2e8f0; font-size: 13px;
    letter-spacing: 0.1em; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.32s; z-index: 10; backdrop-filter: blur(10px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .highlight { color: #7dd3fc; font-weight: 700; }

  @media (min-height: 800px) {
    .menu { gap: 10vh; }
    .menu-btn { padding: 18px 24px; font-size: 18px; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="grid-overlay"></div>
<div class="vignette"></div>

<div class="menu">
  <div class="title-wrap">
    <h1 class="title">SPARTLLE</h1>
    <div class="title-rule"></div>
  </div>

  <div class="buttons">
    <button class="menu-btn" data-mode="adventure">冒险模式</button>
    <button class="menu-btn" data-mode="defense">防御敌袭</button>
    <button class="menu-btn" data-mode="free">自由对战</button>
    <button class="menu-btn" data-mode="codex">棋子图鉴</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/pieces.js"></script>
<script src="js/starfield.js"></script>
<script src="js/save.js"></script>
<script>
(() => {
  'use strict';

  SL.initStarfield(document.getElementById('starfield'), { count: 280, mode: 'layered', twinkle: true, shooting: true, hue: true, layerMid: 0.85 });

  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(html) {
    toast.innerHTML = html; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  document.querySelectorAll('.menu-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const mode = btn.dataset.mode;
      if (mode === 'adventure') window.location.href = 'adventure.html';
      else if (mode === 'defense') showToast('<span class="highlight">防御敌袭</span> · 开发中');
      else if (mode === 'free') window.location.href = 'game.html';
      else if (mode === 'codex') window.location.href = 'codex.html';
    });
  });

})();
</script>
</body>
</html>
