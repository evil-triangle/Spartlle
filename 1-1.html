<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spartlle · 第一章 LEVEL 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/piecesheet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #05050d; color: #e2e8f0;
    font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    /* 允许纵向平移：棋盘要能上下滑动来避开底部弹出的说明条 / 操作框。
       touch-action 会沿祖先链求交，这里若为 none，子元素的滚动会被一起禁掉。 */
    user-select: none; touch-action: pan-y;
  }

  #starfield { position: fixed; inset: 0; display: block; z-index: 0; }
  .vignette { position: fixed; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.9) 100%); pointer-events: none; z-index: 1; }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(5,5,13,0.95) 0%, rgba(5,5,13,0) 100%); pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  
  .topbar-left { display: flex; gap: 8px; }

  .back-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.22); border-radius: 4px; color: #94a3b8;
    font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.22s; backdrop-filter: blur(6px);
  }
  .back-btn:hover, .back-btn:active { color: #fff; border-color: #60a5fa; }

  .hud-stats { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .stat-box {
    display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.22); border-radius: 4px; backdrop-filter: blur(6px);
    font-family: 'Rajdhani', sans-serif;
  }
  .stat-label { font-size: 9px; color: #64748b; font-weight: 700; display: none; }
  .stat-value { font-family: 'Michroma', sans-serif; font-size: 11px; color: #7dd3fc; }
  .stat-box.meteor .stat-value { color: #fbbf24; }
  .stat-box.meteor .stat-icon { color: #fbbf24; }
  .stat-box.wave .stat-value { color: #f87171; }
  .stat-icon { width: 10px; height: 10px; display: flex; align-items: center; justify-content: center; }
  .stat-icon svg { width: 100%; height: 100%; display: block; }

  .phase-tag {
    padding: 4px 8px; border-radius: 4px; font-family: 'Michroma', sans-serif;
    font-size: 9px; letter-spacing: 0.1em; border: 1px solid; transition: all 0.3s;
  }
  .phase-tag.prepare { color: #22d3ee; border-color: rgba(34,211,238,0.5); background: rgba(34,211,238,0.08); }
  .phase-tag.battle { color: #f87171; border-color: rgba(248,113,113,0.5); background: rgba(248,113,113,0.08); animation: phasePulse 1.5s infinite; }
  @keyframes phasePulse { 0%, 100% { box-shadow: 0 0 0 rgba(248,113,113,0); } 50% { box-shadow: 0 0 8px rgba(248,113,113,0.5); } }

  /* ===== 舞台：可上下滑动的棋盘 ===== */
  /* 棋盘尺寸固定不变；弹出栏（说明条 / 攻击移动框）出现时不再缩小棋盘，
     而是靠上下滑动把被盖住的部分移出来。 */
  .stage {
    position: fixed; inset: 0; z-index: 5;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  .board-wrap {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center;
    /* 上下留白由 JS 写入：顶部让开顶栏，底部保证能滚到让棋盘下沿露出底栏上方 */
    padding: var(--pad-top, 60px) var(--pad-right, 6px) var(--pad-bottom, 160px) 6px;
  }
  #board {
    display: block; border-radius: 8px; box-shadow: 0 0 0 1px rgba(96,165,250,0.2), 0 0 30px rgba(96,165,250,0.15);
    cursor: pointer; touch-action: pan-y; flex-shrink: 0;
    /* 有余量时垂直居中，内容超高时 auto 归零 → 顶部不会被裁掉、能滚到 */
    margin: auto 0;
  }

  /* ===== 底部 UI ===== */
  /* 提示挪到顶栏下沿：它原来贴在 125px 高度，正好横在棋盘下边缘 */
  .hint {
    position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 9;
    font-size: 11px; color: #94a3b8; letter-spacing: 0.05em; text-align: center; pointer-events: none;
    padding: 3px 10px; border-radius: 4px; background: rgba(5,5,13,0.8); max-width: 92vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity 0.3s;
  }
  .hint.hidden { opacity: 0; }

  /* 棋子操作条：底栏里的普通一行（不是浮层），不会盖住棋盘 */
  .action-panel {
    display: none; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px;
    width: 100%; max-width: 720px; padding: 4px 6px;
    background: rgba(10, 15, 30, 0.92); border: 1.5px solid rgba(96,165,250,0.4); border-radius: 8px;
  }
  .action-panel.show { display: flex; }
  #actionButtons { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .action-panel-title {
    font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 700; color: #e2e8f0;
    padding: 0 4px 0 2px; border-right: 1px solid rgba(148,163,184,0.3); margin-right: 2px;
  }
  .action-btn {
    padding: 6px 12px; border-radius: 6px; font-family: 'Rajdhani', sans-serif;
    font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s;
    border: 1px solid transparent; background: rgba(15,23,42,0.8); color: #cbd5e1;
  }
  .action-btn.active { border-color: #fbbf24; color: #fde68a; background: rgba(251,191,36,0.1); }
  .action-btn.btn-attack.active { border-color: #ef4444; color: #fca5a5; }
  .action-btn.btn-move.active { border-color: #22c55e; color: #86efac; }
  .action-btn.btn-shoot.active { border-color: #22d3ee; color: #67e8f9; }
  .action-btn.btn-cancel { border-color: rgba(148,163,184,0.3); color: #94a3b8; }

  /* 底栏：棋子说明条常驻在按钮上方（点过棋子就有内容），不再用浮层提示 */
  .bottom-panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 6px 8px; padding-bottom: calc(6px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(5,5,13,0.99) 0%, rgba(5,5,13,0.9) 72%, rgba(5,5,13,0) 100%);
    backdrop-filter: blur(6px);
  }
  .bottom-panel .hint-line {
    width: 100%; max-width: 720px; font-size: 11px; color: #94a3b8; text-align: center;
    line-height: 1.35; min-height: 15px;
  }

  .skip-btn {
    padding: 4px 10px; background: rgba(15,23,42,0.85); border: 1.5px solid rgba(148,163,184,0.3); border-radius: 9px;
    color: #94a3b8; font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
    cursor: pointer; min-height: 62px; display: flex; align-items: center;
  }
  .skip-btn:disabled { opacity: 0.35; }

  .gameover-overlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(2, 4, 10, 0.85);
    backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .gameover-overlay.show { display: flex; }
  .gameover-card {
    text-align: center; padding: 24px; width: 100%; max-width: 320px;
    background: linear-gradient(180deg, rgba(15,23,42,0.98) 0%, rgba(8,12,24,0.98) 100%);
    border: 1.5px solid; border-radius: 12px;
  }
  .gameover-card.win { border-color: rgba(34,211,238,0.6); }
  .gameover-card.lose { border-color: rgba(239,68,68,0.6); }
  .gameover-title { font-family: 'Michroma', sans-serif; font-size: 20px; margin-bottom: 8px; }
  .gameover-card.win .gameover-title { color: #22d3ee; }
  .gameover-card.lose .gameover-title { color: #f87171; }
  .gameover-sub { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
  .gameover-btn {
    padding: 10px 16px; border-radius: 6px; font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid;
  }
  .gameover-btn.primary { color: #0a0a1a; background: #22d3ee; border-color: #22d3ee; }
  .gameover-btn.secondary { color: #94a3b8; border-color: rgba(148,163,184,0.4); background: transparent; margin-left: 8px; }

  @media (min-width: 600px) {
    .stat-label { display: block; }
    .skip-btn { font-size: 12px; padding: 4px 14px; }
    .action-panel { gap: 6px; padding: 6px 10px; }
    .action-btn { padding: 6px 14px; font-size: 13px; }
    #board { border-radius: 10px; box-shadow: 0 0 0 1px rgba(96,165,250,0.2), 0 0 40px rgba(96,165,250,0.15); }
  }

  /* 横屏手机：顶栏与底栏同时变矮，把竖向空间全留给棋盘 */
  @media (max-height: 460px) {
    .hint { top: calc(44px + env(safe-area-inset-top)); font-size: 10px; }
    .bottom-panel .hint-line { display: none; }
  }

  /* 横屏手机：棋子条改为贴右侧竖排 —— 竖屏时它吃掉 140px 高度，
     横屏总共才 390px，横着放棋盘只剩 280px，竖着放能拿到 340px。 */
  @media (orientation: landscape) and (max-height: 520px) {
    #bottomPanel {
      left: auto; right: 0; top: 0; bottom: 0; width: 172px;
      justify-content: center; padding: 8px 6px;
      padding-right: calc(6px + env(safe-area-inset-right, 0px));
      background: linear-gradient(90deg, rgba(5,5,13,0) 0%, rgba(5,5,13,0.96) 24%);
      overflow-y: auto;
    }
    #bottomPanel .hint-line { display: none; }
    .dock-row { flex-direction: column; align-items: stretch; gap: 6px; }
    /* 直接写死列数：元素上的内联 --ps-cols 优先级高于样式表，改变量没用 */
    #pieceContainer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dock-aux { flex-direction: row; }
    .skip-btn { width: 100%; min-height: 32px; justify-content: center; font-size: 11px; }
    .ps-desc-text { max-height: 96px; }

    /* 顶栏给右侧棋子条让位，否则陨石/阶段标签会被盖住 */
    .topbar { padding-right: 184px; }
    .hud-stats { gap: 3px; }
    .hud-stats .stat-box { padding: 3px 6px; }
    .hud-stats .phase-tag { padding: 3px 6px; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="vignette"></div>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn" id="backBtn">← 返回</button>
    <button class="back-btn" id="codexBtn" style="border-color: rgba(168,85,247,0.4); color: #d8b4fe;">📖 图鉴</button>
  </div>
  
  <div class="hud-stats">
    <div class="stat-box"><span class="stat-label">TURN</span><span class="stat-value" id="hudTurn">1</span></div>
    <div class="stat-box meteor">
      <span class="stat-icon"><svg viewBox="0 0 16 16"><path d="M8 1 L15 8 L8 15 L1 8 Z" fill="currentColor"/></svg></span>
      <span class="stat-value" id="hudMeteor">5</span>
    </div>
    <div class="stat-box wave"><span class="stat-label">WAVE</span><span class="stat-value" id="hudWave">0/5</span></div>
    <div class="phase-tag prepare" id="hudPhase">准备</div>
  </div>
</div>

<div class="stage">
  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>
</div>

<div class="hint" id="hint">点击下方棋子进行放置</div>

<div class="bottom-panel" id="bottomPanel">
  <div class="hint-line" id="descLine">点一下棋子，这里会说明它能干什么</div>
  <!-- 操作条是底栏的一行，点棋子时才展开；不再是盖在棋盘上的浮层 -->
  <div class="action-panel" id="actionPanel">
    <div class="action-panel-title" id="actionPanelTitle">棋子</div>
    <div id="actionButtons"></div>
  </div>
  <div class="ps-desc" id="pieceDesc">
    <canvas class="ps-desc-icon" id="descIcon" width="44" height="44"></canvas>
    <div class="ps-desc-body">
      <div class="ps-desc-head"><span id="descName"></span><span class="ps-desc-tag" id="descTag"></span></div>
      <div class="ps-desc-text" id="descText"></div>
    </div>
  </div>
  <div class="dock-row">
    <div class="ps-sheet" id="pieceContainer" style="--ps-cols:3"></div>
    <div class="dock-aux">
      <button class="skip-btn" id="skipBtn">跳过</button>
    </div>
  </div>
</div>

<div class="gameover-overlay" id="gameoverOverlay">
  <div class="gameover-card" id="gameoverCard">
    <div class="gameover-title" id="gameoverTitle">VICTORY</div>
    <div class="gameover-sub" id="gameoverSub">所有敌人已被歼灭</div>
    <div>
      <button class="gameover-btn primary" id="gameoverBackBtn">返回</button>
      <button class="gameover-btn secondary" id="gameoverRetryBtn">重试</button>
    </div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/pieces.js"></script>
<script src="js/piecesheet.js"></script>
<script src="js/starfield.js"></script>
<script src="js/save.js"></script>
<script>
(() => {
  'use strict';

  const CFG = {
    N: 7, CELL: 80, DPR: Math.min(window.devicePixelRatio || 1, 2),
    SPAWN_TURN_START: 7, SPAWN_INTERVAL: 3, MONSTER_MOVE_INTERVAL: 2,
    TOTAL_WAVES: 5, WAVE_SIZES: [2, 2, 2, 2, 3],
    MONSTER_HP: 3, MONSTER_ATK: 1, BASE_HP: 1, FORT_HP: 3, START_METEORS: 5,
  };

  const PIECES = SL.PIECE_TYPES;

  const BASE_POS = { col: 0, row: 0 };
  const FORTS = [{ col: 1, row: 0 }, { col: 0, row: 1 }, { col: 1, row: 1 }];
  const SPAWNER_POS = { col: 6, row: 6 };
  const SPAWN_CELLS = [{ col: 5, row: 6 }, { col: 6, row: 5 }, { col: 5, row: 5 }];

  const DIRS8 = [{dc:1,dr:0},{dc:-1,dr:0},{dc:0,dr:1},{dc:0,dr:-1},{dc:1,dr:1},{dc:1,dr:-1},{dc:-1,dr:1},{dc:-1,dr:-1}];
  const DIRS4 = [{dc:1,dr:0},{dc:-1,dr:0},{dc:0,dr:1},{dc:0,dr:-1}];

  const C = {
    empty: '#0f0f1a', grid: '#1e1e30', base: '#101c3d', fort: '#0f1830',
    spawner: '#1a0511', spawnCell: '#150612',
    p1: '#3b82f6', p1d: '#1e40af', p1l: '#93c5fd',
    monster: '#7f1d1d', monsterD: '#450a0a', monsterL: '#f87171',
    hover: '#ffffff', select: '#fbbf24', valid: '#22c55e',
    aim: '#22d3ee', aimEmpty: '#64748b', attack: '#ef4444', move: '#22c55e'
  };

  // 提前声明，供 updateHUD 使用（真正的赋值在下方「棋子条」一节）
  let pieceButtons = [];
  let descShown = null;

  const state = {
    turn: 1, completedTurns: 0, meteors: CFG.START_METEORS,
    pieces: new Map(), monsters: [], wave: 0, phase: 'prepare',
    gameOver: false, victory: false, isProcessing: false, turnPhase: null, animT: 0, animDur: 0.4,
  };

  let placing = null, selected = null, controlAction = null, hover = null;
  let arrows = [], effects = [];

  function cellRect(col, row) { return { x: col * CFG.CELL, y: (CFG.N - 1 - row) * CFG.CELL, w: CFG.CELL, h: CFG.CELL }; }
  function cellCenter(col, row) { const r = cellRect(col, row); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; }
  function pixelToCell(px, py, rectWidth, rectHeight) {
    const scaleX = SIZE / rectWidth; const scaleY = SIZE / rectHeight;
    const col = Math.floor((px * scaleX) / CFG.CELL); const row = CFG.N - 1 - Math.floor((py * scaleY) / CFG.CELL);
    return (col >= 0 && col < CFG.N && row >= 0 && row < CFG.N) ? { col, row } : null;
  }

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const SIZE = CFG.N * CFG.CELL;
  canvas.width = SIZE * CFG.DPR; canvas.height = SIZE * CFG.DPR; ctx.scale(CFG.DPR, CFG.DPR);

  const roundRect = (x, y, w, h, r) => SL.roundRectCtx(ctx, x, y, w, h, r);

  const key = (c, r) => c + ',' + r;
  const inBounds = (c, r) => c >= 0 && c < CFG.N && r >= 0 && r < CFG.N;

  function isDisabledCell(col, row) {
    if (col === SPAWNER_POS.col && row === SPAWNER_POS.row) return true;
    for (const s of SPAWN_CELLS) if (s.col === col && s.row === row) return true;
    return false;
  }
  function isBaseCell(col, row) { return col === BASE_POS.col && row === BASE_POS.row; }
  function isFortCell(col, row) { return FORTS.some(f => f.col === col && f.row === row); }
  function isSpawnCell(col, row) { return SPAWN_CELLS.some(s => s.col === col && s.row === row); }

  function getPieceAt(col, row) { return state.pieces.get(key(col, row)); }
  function getMonsterAt(col, row) { return state.monsters.find(m => m.col === col && m.row === row); }

  function initPieces() {
    state.pieces.set(key(BASE_POS.col, BASE_POS.row), { type: 'base', hp: CFG.BASE_HP, maxHp: CFG.BASE_HP });
    for (const f of FORTS) state.pieces.set(key(f.col, f.row), { type: 'fort', hp: CFG.FORT_HP, maxHp: CFG.FORT_HP });
  }

  function getPlaceableCells() {
    const set = new Set();
    for (const [k, piece] of state.pieces) {
      const [col, row] = k.split(',').map(Number);
      for (const d of DIRS8) {
        const c = col + d.dc; const r = row + d.dr;
        if (!inBounds(c, r) || isDisabledCell(c, r) || state.pieces.has(key(c, r)) || getMonsterAt(c, r)) continue;
        set.add(key(c, r));
      }
    }
    return [...set].map(k => { const [col, row] = k.split(',').map(Number); return { col, row }; });
  }

  function doPlace(type, col, row) {
    const def = PIECES[type];
    if (!def || state.meteors < def.cost || state.pieces.has(key(col, row)) || getMonsterAt(col, row) || isDisabledCell(col, row)) return false;
    const legal = getPlaceableCells().some(c => c.col === col && c.row === row); if (!legal) return false;
    state.meteors -= def.cost; state.pieces.set(key(col, row), { type, hp: def.maxHp, maxHp: def.maxHp });
    endPlayerTurn(); return true;
  }

  function findShootTarget(col, row, dc, dr) {
    let c = col + dc; let r = row + dr;
    while (inBounds(c, r)) {
      if (c === SPAWNER_POS.col && r === SPAWNER_POS.row) return { col: c, row: r, kind: 'spawner' };
      const mon = getMonsterAt(c, r); if (mon) return { col: c, row: r, kind: 'monster', monster: mon };
      const piece = getPieceAt(c, r); if (piece) return { col: c, row: r, kind: 'piece', piece };
      c += dc; r += dr;
    }
    return null;
  }

  function doShoot(col, row, dc, dr) {
    const piece = getPieceAt(col, row); if (!piece || piece.kind === 'base' || piece.kind === 'fort') return false;
    const hit = findShootTarget(col, row, dc, dr); const start = cellCenter(col, row);
    let end, target = null;
    if (hit) {
      end = cellCenter(hit.col, hit.row);
      if (hit.kind === 'monster') target = { kind: 'monster', ref: hit.monster };
      else if (hit.kind === 'piece') target = { kind: 'piece', col: hit.col, row: hit.row };
    } else {
      let c = col, r = row; while (inBounds(c + dc, r + dr)) { c += dc; r += dr; }
      const outCol = c + dc; const outRow = r + dr;
      end = { x: (outCol + 0.5) * CFG.CELL, y: (CFG.N - outRow - 0.5) * CFG.CELL };
    }
    const dist = Math.hypot(end.x - start.x, end.y - start.y); const dur = Math.max(0.15, dist / 1400);
    arrows.push({ x0: start.x, y0: start.y, x: start.x, y: start.y, tx: end.x, ty: end.y, t: 0, dur, target });
    endPlayerTurn(); return true;
  }

  function doMeleeAttack(fromCol, fromRow, toCol, toRow) {
    const attacker = getPieceAt(fromCol, fromRow); if (!attacker) return false;
    const mon = getMonsterAt(toCol, toRow); if (!mon) return false;
    const dmg = PIECES[attacker.type].attackDamage || 1; mon.hp -= dmg;
    addDamageEffect(toCol, toRow, dmg); addEffect({ type: 'attack', col: toCol, row: toRow, t: 0, dur: 0.4 });
    if (mon.hp <= 0) killMonster(mon);

  }

  function getMoveTargets(col, row) {
    const piece = getPieceAt(col, row); if (!piece || piece.type !== 'warrior') return [];
    const range = PIECES.warrior.moveRange; const out = [];
    for (const d of DIRS4) {
      for (let step = 1; step <= range; step++) {
        const c = col + d.dc * step; const r = row + d.dr * step;
        if (!inBounds(c, r) || state.pieces.has(key(c, r)) || getMonsterAt(c, r) || isDisabledCell(c, r)) break;
        out.push({ col: c, row: r, step });

    } return out;
  }

  function doMove(fromCol, fromRow, toCol, toRow) {
    const piece = getPieceAt(fromCol, fromRow); if (!piece) return false;
    state.pieces.delete(key(fromCol, fromRow)); state.pieces.set(key(toCol, toRow), piece);
    endPlayerTurn(); return true;
  }

  function addEffect(e) { effects.push(e); }
  function addDamageEffect(col, row, amount) { addEffect({ type: 'damage', col, row, amount, t: 0, dur: 0.8 }); }
  function addDeathEffect(col, row, color) { addEffect({ type: 'death', col, row, t: 0, dur: 0.6, color }); }
  function killMonster(mon) { const idx = state.monsters.indexOf(mon); if (idx >= 0) { addDeathEffect(mon.col, mon.row, '#fca5a5'); state.monsters.splice(idx, 1); } }

  function endPlayerTurn() {
    if (state.gameOver || state.isProcessing) return;
    selected = null; controlAction = null; placing = null; renderActionPanel();
    state.completedTurns++; state.turn = state.completedTurns + 1;
    state.isProcessing = true; state.turnPhase = 'projectile';
    if (arrows.length === 0) startMonsterPhase();
  }

  function startMonsterPhase() {
    if (shouldSpawnWave(state.completedTurns)) spawnWave();
    const shouldMove = (state.completedTurns % CFG.MONSTER_MOVE_INTERVAL === 0);
    if (shouldMove) {
      for (const mon of state.monsters) { mon.oldCol = mon.col; mon.oldRow = mon.row; }
      executeMonsterTurn(); state.turnPhase = 'monsterMove'; state.animT = 0;
    } else { finishTurnPhase(); }
  }

  function finishTurnPhase() {
    state.isProcessing = false; state.turnPhase = null;
    checkGameEnd();
    if (!state.gameOver) {
      let gained = 0; for (const [, piece] of state.pieces) { if (piece.type === 'star') gained += PIECES.star.produce; }
      state.meteors += gained;
    }
    updateHUD();
  }

  function updateTurnPhase(dt) {
    if (!state.isProcessing) return;
    if (state.turnPhase === 'projectile') { if (arrows.length === 0) startMonsterPhase(); }
    else if (state.turnPhase === 'monsterMove') {
      state.animT += dt / state.animDur;
      if (state.animT >= 1) { state.animT = 1; finishTurnPhase(); }
    }
  }

  function shouldSpawnWave(t) {
    if (state.wave >= CFG.TOTAL_WAVES || t < CFG.SPAWN_TURN_START) return false;
    if ((t - CFG.SPAWN_TURN_START) % CFG.SPAWN_INTERVAL !== 0) return false;
    return true;
  }

  function spawnWave() {
    const count = CFG.WAVE_SIZES[state.wave];
    const available = SPAWN_CELLS.filter(s => !state.pieces.has(key(s.col, s.row)) && !getMonsterAt(s.col, s.row));
    const shuffled = [...available].sort(() => Math.random() - 0.5);
    let spawned = 0;
    for (const s of shuffled) {
      if (spawned >= count) break;
      state.monsters.push({ col: s.col, row: s.row, hp: CFG.MONSTER_HP, maxHp: CFG.MONSTER_HP, preferLeft: Math.random() < 0.5, bornTurn: state.completedTurns });
      spawned++;

    state.wave++; state.phase = 'battle';
  }

  function executeMonsterTurn() {
    if (state.monsters.length === 0) return;
    const sorted = [...state.monsters].sort((a, b) => (a.col + a.row) - (b.col + b.row));
    const occupied = new Set();
    for (const mon of sorted) {
      if (mon.bornTurn === state.completedTurns) continue;
      const dirs = mon.preferLeft ? ['left', 'down'] : ['down', 'left'];
      for (const dir of dirs) {
        let c = mon.col, r = mon.row;
        if (dir === 'left') c -= 1; else if (dir === 'down') r -= 1;
        if (!inBounds(c, r) || (c === SPAWNER_POS.col && r === SPAWNER_POS.row)) continue;
        const piece = getPieceAt(c, r);
        if (piece) {
          piece.hp -= CFG.MONSTER_ATK; addDamageEffect(c, r, CFG.MONSTER_ATK); addEffect({ type: 'attack', col: c, row: r, t: 0, dur: 0.4 });
          if (piece.hp <= 0) { state.pieces.delete(key(c, r)); addDeathEffect(c, r, '#93c5fd'); }
          break;
        }
        if (occupied.has(key(c, r)) || state.monsters.find(m => m !== mon && m.col === c && m.row === r)) continue;
        mon.col = c; mon.row = r; occupied.add(key(c, r)); break;

  }

  function checkGameEnd() {
    const basePiece = getPieceAt(BASE_POS.col, BASE_POS.row);
    if (!basePiece || basePiece.hp <= 0) { state.gameOver = true; state.phase = 'defeat'; showGameOver(false); return; }
    if (state.wave >= CFG.TOTAL_WAVES && state.monsters.length === 0) { state.gameOver = true; state.victory = true; state.phase = 'victory'; showGameOver(true); return; }
  }

  function showGameOver(win) {
    const overlay = document.getElementById('gameoverOverlay'); const card = document.getElementById('gameoverCard');
    const title = document.getElementById('gameoverTitle'); const sub = document.getElementById('gameoverSub');
    card.className = 'gameover-card ' + (win ? 'win' : 'lose');
    title.textContent = win ? 'VICTORY' : 'DEFEAT';
    sub.textContent = win ? '所有敌人已被歼灭' : '大本营已被摧毁';
    overlay.classList.add('show');
    if (win) {
      try {
        const SAVE_KEY = 'spartlle_adventure_v1'; const raw = localStorage.getItem(SAVE_KEY);
        const save = raw ? JSON.parse(raw) : { version: 1, progress: {} }; if (!save.progress) save.progress = {};
        const k = `c1-l1`; const p = save.progress[k] || { easy: false, hard: false, x: false };
        const params = new URLSearchParams(window.location.search); const d = (params.get('d') || 'easy').toLowerCase();
        if (d === 'easy' || d === 'hard' || d === 'x') p[d] = true;
        save.progress[k] = p; localStorage.setItem(SAVE_KEY, JSON.stringify(save));
      } catch (e) {}
    }
  }

  function drawFloor(col, row) {
    const r = cellRect(col, row); let fill = C.empty;
    if (isBaseCell(col, row)) fill = C.base; else if (isFortCell(col, row)) fill = C.fort;
    else if (col === SPAWNER_POS.col && row === SPAWNER_POS.row) fill = C.spawner; else if (isSpawnCell(col, row)) fill = C.spawnCell;
    ctx.fillStyle = fill; ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    const cx = r.x + r.w / 2; const cy = r.y + r.h / 2;
    if (col === SPAWNER_POS.col && row === SPAWNER_POS.row) {
      const pulse = 1 + 0.08 * Math.sin(performance.now() / 320);
      ctx.save(); ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 16 * pulse; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 8, cy); ctx.lineTo(cx + 8, cy); ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy + 8); ctx.stroke();
    } else if (isSpawnCell(col, row)) {
      ctx.save(); ctx.strokeStyle = 'rgba(239,68,68,0.15)'; ctx.lineWidth = 1.5;
      for (let i = -r.w; i < r.w; i += 12) { ctx.beginPath(); ctx.moveTo(r.x + i, r.y); ctx.lineTo(r.x + i + r.h, r.y + r.h); ctx.stroke(); } ctx.restore();
    }
  }

  function drawPieceVisual(col, row, piece, alpha = 1) {
    const r = cellRect(col, row); const cx = r.x + r.w / 2; const cy = r.y + r.h / 2;
    const size = r.w - 12; const half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha; SL.paintPieceBody(ctx, cx, cy, size, piece.type, 'player');
    const hpStr = String(Math.max(0, piece.hp)); ctx.font = `900 12px ui-sans-serif, system-ui, sans-serif`;
    const textW = ctx.measureText(hpStr).width; const badgeH = 16; const badgeW = Math.max(badgeH, textW + 10); const rad = badgeH / 2;
    const bx = cx + half - badgeW - 1; const by = cy + half - badgeH - 1;
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; roundRect(bx, by, badgeW, badgeH, rad); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; roundRect(bx, by, badgeW, badgeH, rad); ctx.stroke();
    const ratio = Math.max(0, piece.hp) / piece.maxHp; ctx.fillStyle = ratio > 0.6 ? '#ffffff' : ratio > 0.3 ? '#fde68a' : '#fca5a5';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hpStr, bx + badgeW / 2, by + badgeH / 2 + 0.5); ctx.restore();
  }

  function drawMonsterVisual(mon, alpha = 1) {
    let rCol = mon.col; let rRow = mon.row;
    if (state.isProcessing && state.turnPhase === 'monsterMove' && mon.oldCol !== undefined) {
      const t = Math.min(1, state.animT); const easeT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      rCol = mon.oldCol + (mon.col - mon.oldCol) * easeT; rRow = mon.oldRow + (mon.row - mon.oldRow) * easeT;
    }
    const r = cellRect(rCol, rRow); const cx = r.x + r.w / 2; const cy = r.y + r.h / 2;
    const size = r.w - 12; const half = size / 2;
    ctx.save(); ctx.globalAlpha = alpha; SL.paintPieceBody(ctx, cx, cy, size, 'monster', 'monster');
    const hpStr = String(Math.max(0, mon.hp)); ctx.font = `900 12px ui-sans-serif, system-ui, sans-serif`;
    const textW = ctx.measureText(hpStr).width; const badgeH = 16; const badgeW = Math.max(badgeH, textW + 10); const rad = badgeH / 2;
    const bx = cx + half - badgeW - 1; const by = cy + half - badgeH - 1;
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; roundRect(bx, by, badgeW, badgeH, rad); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4; roundRect(bx, by, badgeW, badgeH, rad); ctx.stroke();
    const ratio = Math.max(0, mon.hp) / mon.maxHp; ctx.fillStyle = ratio > 0.6 ? '#ffffff' : ratio > 0.3 ? '#fde68a' : '#fca5a5';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(hpStr, bx + badgeW / 2, by + badgeH / 2 + 0.5); ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    for (let row = 0; row < CFG.N; row++) { for (let col = 0; col < CFG.N; col++) { drawFloor(col, row); } }

    if (placing) {
      const cells = getPlaceableCells();
      for (const { col, row } of cells) {
        const r = cellRect(col, row); ctx.fillStyle = 'rgba(34,197,94,0.18)'; ctx.fillRect(r.x + 4, r.y + 4, r.w - 8, r.h - 8);
        ctx.strokeStyle = C.valid; ctx.lineWidth = 1.5; ctx.strokeRect(r.x + 4.5, r.y + 4.5, r.w - 9, r.h - 9);
      }
    }

    if (selected && controlAction) {
      const c0 = cellCenter(selected.col, selected.row);
      if (controlAction === 'shoot') {
        for (const d of DIRS8) {
          const nc = selected.col + d.dc, nr = selected.row + d.dr; if (!inBounds(nc, nr)) continue;
          const c1 = cellCenter(nc, nr); const hit = findShootTarget(selected.col, selected.row, d.dc, d.dr);
          const color = hit && hit.kind === 'monster' ? C.aim : C.aimEmpty;
          ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = hit ? 0.9 : 0.35; ctx.lineWidth = hit ? 3 : 2; ctx.setLineDash([5, 5]);
          ctx.beginPath(); ctx.moveTo(c0.x, c0.y); ctx.lineTo(c1.x, c1.y); ctx.stroke(); ctx.restore();
        }

        for (const d of DIRS8) {
          const c = selected.col + d.dc, r = selected.row + d.dr; if (!inBounds(c, r)) continue;
          const rect = cellRect(c, r); const mon = getMonsterAt(c, r); const isEnemy = !!mon;
          ctx.fillStyle = isEnemy ? 'rgba(239,68,68,0.3)' : 'rgba(239,68,68,0.06)'; ctx.fillRect(rect.x + 4, rect.y + 4, rect.w - 8, rect.h - 8);
          ctx.strokeStyle = isEnemy ? C.attack : 'rgba(239,68,68,0.25)'; ctx.lineWidth = isEnemy ? 2.5 : 1; ctx.strokeRect(rect.x + 4.5, rect.y + 4.5, rect.w - 9, rect.h - 9);
        }
      } else if (controlAction === 'move') {
        const targets = getMoveTargets(selected.col, selected.row);
        for (const t of targets) {
          const r = cellRect(t.col, t.row); ctx.fillStyle = 'rgba(34,197,94,0.2)'; ctx.fillRect(r.x + 4, r.y + 4, r.w - 8, r.h - 8);
          ctx.strokeStyle = C.move; ctx.lineWidth = 1.8; ctx.strokeRect(r.x + 4.5, r.y + 4.5, r.w - 9, r.h - 9);
          const bx = r.x + 14, by = r.y + 14; ctx.fillStyle = 'rgba(34,197,94,0.9)'; ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.font = '900 11px ui-sans-serif, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t.step, bx, by + 0.5);
        }
      }
    }

    for (const [k, piece] of state.pieces) { const [col, row] = k.split(',').map(Number); drawPieceVisual(col, row, piece); }
    for (const mon of state.monsters) { drawMonsterVisual(mon); }

    if (placing && hover) {
      if (getPlaceableCells().some(c => c.col === hover.col && c.row === hover.row)) {
        const def = PIECES[placing]; drawPieceVisual(hover.col, hover.row, { type: placing, hp: def.maxHp, maxHp: def.maxHp }, 0.6);
      }
    }

    if (selected) {
      const r = cellRect(selected.col, selected.row); const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 200);
      ctx.save(); ctx.strokeStyle = C.select; ctx.lineWidth = 3; ctx.shadowColor = C.select; ctx.shadowBlur = 10 * pulse; ctx.strokeRect(r.x + 3, r.y + 3, r.w - 6, r.h - 6); ctx.restore();
    }

    if (hover) { const r = cellRect(hover.col, hover.row); ctx.strokeStyle = C.hover; ctx.lineWidth = 2; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); }

    for (const a of arrows) {
      const ang = Math.atan2(a.ty - a.y0, a.tx - a.x0);
      ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(ang); ctx.shadowColor = '#60a5fa'; ctx.shadowBlur = 8; ctx.fillStyle = '#bfdbfe'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-7, -6); ctx.lineTo(-3, 0); ctx.lineTo(-7, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }

    for (const e of effects) {
      const r = cellRect(e.col, e.row); const cx = r.x + r.w / 2; const cy = r.y + r.h / 2; const p = Math.min(1, e.t / e.dur); const alpha = 1 - p;
      if (e.type === 'damage') {
        ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#fca5a5'; ctx.font = `900 22px ui-sans-serif, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 3;
        ctx.strokeText(`-${e.amount}`, cx, cy - 20 - p * 20); ctx.fillText(`-${e.amount}`, cx, cy - 20 - p * 20); ctx.restore();
      } else if (e.type === 'death') {

      }
    }
  }

  function updateHUD() {
    document.getElementById('hudTurn').textContent = state.turn;
    document.getElementById('hudMeteor').textContent = state.meteors;
    document.getElementById('hudWave').textContent = `${state.wave}/${CFG.TOTAL_WAVES}`;
    const phaseEl = document.getElementById('hudPhase');
    if (state.phase === 'prepare') { phaseEl.textContent = '准备'; phaseEl.className = 'phase-tag prepare'; }
    else if (state.phase === 'battle') { phaseEl.textContent = '战斗'; phaseEl.className = 'phase-tag battle'; }
    else if (state.phase === 'victory') { phaseEl.textContent = '胜利'; phaseEl.className = 'phase-tag prepare'; }
    else if (state.phase === 'defeat') { phaseEl.textContent = '失败'; phaseEl.className = 'phase-tag battle'; }

    SL.piecesheet.syncSheet(pieceButtons, { meteors: state.meteors, locked: state.gameOver || state.isProcessing, active: placing });
    document.getElementById('skipBtn').disabled = state.gameOver || state.isProcessing;

    const hint = document.getElementById('hint');
    const descLine = document.getElementById('descLine');
    if (state.gameOver) { hint.textContent = state.victory ? '胜利！' : '失败...'; hint.classList.remove('hidden'); }
    else if (state.isProcessing) { hint.textContent = '敌人行动中...'; hint.classList.remove('hidden'); }
    else if (placing) { hint.textContent = `选择绿色格放置「${PIECES[placing].name}」`; hint.classList.remove('hidden'); }
    else if (selected) { hint.classList.add('hidden'); }
    else if (state.phase === 'prepare') {
      const turnsLeft = CFG.SPAWN_TURN_START - state.completedTurns - 1;
      hint.textContent = turnsLeft > 0 ? `发育阶段 · 还有 ${turnsLeft} 回合敌军抵达` : '即将迎来敌军'; hint.classList.remove('hidden');
    } else {
      const nextMoveIn = CFG.MONSTER_MOVE_INTERVAL - (state.completedTurns % CFG.MONSTER_MOVE_INTERVAL);
      hint.textContent = `点击己方棋子操作 · 怪物还有 ${nextMoveIn} 回合行动`; hint.classList.remove('hidden');
    }

    // 底栏里的一行提示：说明当前选中的棋子，或引导玩家点一下棋子看说明
    if (descLine) {
      if (placing) descLine.textContent = `已选中「${PIECES[placing].name}」，点绿色格放置（再点一次棋子取消）`;
      else if (descShown) descLine.textContent = '再点一次该棋子可收起说明';
      else descLine.textContent = '点一下棋子，这里会说明它能干什么';
    }
  }

  function renderActionPanel() {
    const panel = document.getElementById('actionPanel'); const title = document.getElementById('actionPanelTitle'); const btnContainer = document.getElementById('actionButtons');
    if (!selected || state.gameOver || state.isProcessing) { panel.classList.remove('show'); return; }
    const piece = getPieceAt(selected.col, selected.row); if (!piece) { panel.classList.remove('show'); return; }
    title.textContent = PIECES[piece.type].name; btnContainer.innerHTML = '';

    const addBtn = (label, action, activeClass) => {
      const b = document.createElement('button'); b.className = 'action-btn ' + activeClass; b.textContent = label;
      if (controlAction === action) b.classList.add('active');
      b.onclick = () => { controlAction = action; updateHUD(); renderActionPanel(); draw(); };
      btnContainer.appendChild(b);
    };

    if (piece.type === 'archer') addBtn('射击', 'shoot', 'btn-shoot');
    else if (piece.type === 'warrior') { addBtn('攻击', 'attack', 'btn-attack'); addBtn('移动', 'move', 'btn-move'); }

    const cancelBtn = document.createElement('button'); cancelBtn.className = 'action-btn btn-cancel'; cancelBtn.textContent = '取消';
    cancelBtn.onclick = () => clearSelection(); btnContainer.appendChild(cancelBtn);

  function clearSelection() { selected = null; controlAction = null; renderActionPanel(); updateHUD(); draw(); }

  // 桌面：鼠标移动即高亮格子（不必按住）；点击落子。
  // 触屏：轻点落子；上下滑动交给 .stage 滚动，滑动不误落子，也不留高亮残影。
  const TAP_SLOP = 10;      // 位移超过这个像素算「滑动」，不算点击
  let press = null;         // { x, y, moved }

  canvas.addEventListener('pointerdown', (e) => {
    press = { x: e.clientX, y: e.clientY, moved: false };
    if ((e.pointerType || 'mouse') === 'mouse') updateHover(e);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (press && (Math.abs(e.clientX - press.x) > TAP_SLOP || Math.abs(e.clientY - press.y) > TAP_SLOP)) press.moved = true;
    // 桌面端：不按下也跟随高亮；触屏不画 hover（避免残留）
    if ((e.pointerType || 'mouse') === 'mouse') updateHover(e);
  });
  canvas.addEventListener('pointerup', (e) => {
    const p = press; press = null;
    // 只有「按下后没怎么移动」才算点击，桌面/触屏统一在这里处理（不再用 click，避免双触发）
    if (p && !p.moved) handleTap(e);
  });
  canvas.addEventListener('pointercancel', () => { press = null; if (hover) { hover = null; draw(); } });
  canvas.addEventListener('pointerleave', () => { if (hover) { hover = null; draw(); } });

  function updateHover(e) {
    const rect = canvas.getBoundingClientRect(); const cell = pixelToCell(e.clientX - rect.left, e.clientY - rect.top, rect.width, rect.height);
    if ((hover && cell && hover.col === cell.col && hover.row === cell.row) || (!hover && !cell)) return;
    hover = cell;

    if (selected && controlAction && cell) {
      let isTarget = false; const dc = cell.col - selected.col; const dr = cell.row - selected.row; const inAdj8 = Math.abs(dc) <= 1 && Math.abs(dr) <= 1 && (dc !== 0 || dr !== 0);
      if (controlAction === 'shoot' && inAdj8) isTarget = true;
      else if (controlAction === 'attack' && inAdj8 && getMonsterAt(cell.col, cell.row)) isTarget = true;
      else if (controlAction === 'move' && getMoveTargets(selected.col, selected.row).some(t => t.col === cell.col && t.row === cell.row)) isTarget = true;
      canvas.style.cursor = isTarget ? 'pointer' : 'not-allowed'; if (controlAction === 'shoot' && inAdj8) canvas.style.cursor = 'crosshair';
    } else { canvas.style.cursor = 'pointer'; }
    draw();
  }

  function handleTap(e) {
    if (state.gameOver || state.isProcessing) return;
    const rect = canvas.getBoundingClientRect(); const cell = pixelToCell(e.clientX - rect.left, e.clientY - rect.top, rect.width, rect.height);

    if (!cell) { if (placing) { placing = null; updateHUD(); draw(); } else if (selected) clearSelection(); return; }

    if (selected && controlAction) {
      const { col, row } = selected; const dc = cell.col - col; const dr = cell.row - row; const inAdj8 = Math.abs(dc) <= 1 && Math.abs(dr) <= 1 && (dc !== 0 || dr !== 0);

      if (controlAction === 'shoot' && inAdj8) { doShoot(col, row, dc, dr); updateHUD(); draw(); return; }
      if (controlAction === 'attack' && inAdj8) { if (doMeleeAttack(col, row, cell.col, cell.row)) { updateHUD(); draw(); return; } }
      if (controlAction === 'move' && getMoveTargets(col, row).some(t => t.col === cell.col && t.row === cell.row)) { doMove(col, row, cell.col, cell.row); updateHUD(); draw(); return; }
      clearSelection(); return;
    }

    if (placing) { if (doPlace(placing, cell.col, cell.row)) { placing = null; updateHUD(); draw(); } return; }

    const piece = getPieceAt(cell.col, cell.row);
    if (piece && (piece.type === 'archer' || piece.type === 'warrior')) { selected = { col: cell.col, row: cell.row }; controlAction = null; renderActionPanel(); updateHUD(); draw(); return; }
    if (selected) clearSelection();
  }

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ==================== 棋子条 + 说明 ====================
  // 本关开放建造的棋子（id 白名单；引擎新增棋子不会自动塞进本关）
  const BUILDABLE = ['star', 'archer', 'warrior'];

  const pieceContainer = document.getElementById('pieceContainer');
  const descBox = document.getElementById('pieceDesc');
  const descIcon = document.getElementById('descIcon');
  const descName = document.getElementById('descName');
  const descTag = document.getElementById('descTag');
  const descText = document.getElementById('descText');

  function showDesc(id) {
    const p = SL.piecesheet.get(id);
    if (!p) return;
    descShown = id;
    SL.piecesheet.paintIcon(descIcon, id, 'player');
    descName.textContent = p.name;
    descTag.textContent = `${p.cost} 陨石 · ${p.maxHp} 血 · ${p.categoryName}`;
    descText.textContent = p.desc;
    descBox.classList.add('show');
    updateHUD();
  }

  function hideDesc() {
    descShown = null;
    descBox.classList.remove('show');
    updateHUD();
  }

  pieceButtons = SL.piecesheet.renderSheet(pieceContainer, BUILDABLE, {
    // 买不起也能点开看说明（不进放置状态）；再点一次收起
    onInspect: (id) => {
      if (descShown === id) hideDesc(); else showDesc(id);
    },
    onPick: (id) => {
      if (state.gameOver || state.isProcessing) return;
      showDesc(id);
      if (placing === id) placing = null; else { placing = id; selected = null; controlAction = null; renderActionPanel(); }
      updateHUD(); draw();
    },
  });

  // 说明条 / 操作框展开会让底栏变高：只更新滚动留白，让被盖住的棋盘能滚出来。
  // 不重算棋盘尺寸，避免弹出面板时棋盘突然缩小、跳动。
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => layoutChrome());
    ro.observe(document.getElementById('bottomPanel'));
    ro.observe(document.querySelector('.topbar'));
  }

  // 桌面端：鼠标移上去先看说明，不必先选中
  if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
    pieceButtons.forEach((btn) => {
      btn.addEventListener('mouseenter', () => { if (!descShown) showDesc(btn.dataset.piece); });
      btn.addEventListener('mouseleave', () => { if (!placing) hideDesc(); });
    });
  }

  document.getElementById('skipBtn').onclick = () => {
    if (state.gameOver || state.isProcessing) return;
    placing = null; selected = null; controlAction = null; renderActionPanel(); endPlayerTurn(); updateHUD(); draw();
  };
  document.getElementById('backBtn').onclick = () => { window.location.href = 'adventure.html'; };
  
  document.getElementById('codexBtn').onclick = () => {
    window.open('codex.html', '_blank');
  };

  document.getElementById('gameoverBackBtn').onclick = () => { window.location.href = 'adventure.html'; };
  document.getElementById('gameoverRetryBtn').onclick = () => { window.location.reload(); };

  function renderPieceIcons() {
    // 图标已由 SL.piecesheet.renderSheet 画好，这里只在设备像素比变化时重画一次
    pieceButtons.forEach((btn) => SL.piecesheet.paintIcon(btn.querySelector('canvas'), btn.dataset.piece, 'player'));
  }

  // ==================== 尺寸自适应：固定棋盘 + 纵向滚动 ====================
  // 核心：棋盘边长只由「视口」决定，绝不读顶栏/底栏的实时高度。
  // 于是点棋子弹出说明条、选中棋子弹出操作框时，棋盘尺寸都不会跳动或缩小；
  // 被顶栏/底栏盖住的部分，靠 .stage 纵向滚动移出来看。
  const SIDE_QUERY = '(orientation: landscape) and (max-height: 520px)';
  const SIDE_W = 174;

  // 只写「滚动留白」的 CSS 变量，不碰棋盘尺寸。
  // 底栏变高时由 ResizeObserver 调用，目的是让被盖住的棋盘能滚出来。
  function layoutChrome() {
    const root = document.documentElement;
    const topbar = document.querySelector('.topbar');
    const bottom = document.getElementById('bottomPanel');
    const topH = topbar ? topbar.getBoundingClientRect().height : 56;
    const botH = bottom ? bottom.getBoundingClientRect().height : 140;

    if (window.matchMedia(SIDE_QUERY).matches) {
      // 横屏：底栏变成右侧竖条，占宽度不占高度
      root.style.setProperty('--pad-top', '50px');
      root.style.setProperty('--pad-bottom', '24px');
      root.style.setProperty('--pad-right', (SIDE_W + 6) + 'px');
      root.style.setProperty('--dock-h', '0px');
    } else {
      root.style.setProperty('--pad-top', Math.ceil(topH + 12) + 'px');
      // 底部留白 = 底栏当前高 + 余量，保证能把棋盘下沿滚到底栏上方
      root.style.setProperty('--pad-bottom', Math.ceil(botH + 40) + 'px');
      root.style.setProperty('--pad-right', '6px');
      root.style.setProperty('--dock-h', Math.ceil(botH) + 'px');
    }
  }

  // 棋盘边长：可用宽 / 可用高取小。竖向预算用固定值（不实测 DOM），
  // 所以底栏内容变化不会改变棋盘尺寸 —— 这就是「固定棋盘」。
  function fitCanvas() {
    const side = window.matchMedia(SIDE_QUERY).matches;
    const availW = window.innerWidth - (side ? SIDE_W : 0) - 12;
    const availH = window.innerHeight - (side ? 56 : 150);
    const size = Math.max(120, Math.min(availW, availH));
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    layoutChrome();
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1); lastTime = now;

    for (let i = arrows.length - 1; i >= 0; i--) {
      const a = arrows[i]; a.t += dt / a.dur;
      if (a.t >= 1) {
        if (a.target && a.target.kind === 'monster') {
          const mon = a.target.ref;
          if (mon && mon.hp > 0) { mon.hp -= 1; addDamageEffect(mon.col, mon.row, 1); if (mon.hp <= 0) killMonster(mon); }
        }
        arrows.splice(i, 1);
      } else { a.x = a.x0 + (a.tx - a.x0) * a.t; a.y = a.y0 + (a.ty - a.y0) * a.t; }
    }
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i]; e.t += dt; if (e.t >= e.dur) effects.splice(i, 1);
    }

    updateTurnPhase(dt);
    draw(); requestAnimationFrame(loop);
  }

  const starfield = document.getElementById('starfield');
  SL.initStarfield(starfield, { count: 160, mode: 'simple', bg: '#05050d' });

  function boot() {
    fitCanvas();
    initPieces(); renderPieceIcons(); updateHUD(); draw(); requestAnimationFrame(loop);

    // resize 会在地址栏收缩、旋转屏幕时连续触发，合并到一帧里处理避免抖动
    let raf = null;
    const refit = () => {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => { raf = null; fitCanvas(); });
    };
    window.addEventListener('resize', refit);
    window.addEventListener('orientationchange', refit);
  }

  boot();
})();
</script>
</body>
