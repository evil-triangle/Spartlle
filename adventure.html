<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartlle · 冒险模式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05050d;
    color: #e2e8f0;
    font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }

  #starfield { position: fixed; inset: 0; display: block; z-index: 0; }
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.9) 100%);
    pointer-events: none; z-index: 1;
  }
  .grid-overlay {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(96, 165, 250, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96, 165, 250, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    pointer-events: none; z-index: 1;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    background: linear-gradient(180deg, rgba(5,5,13,0.95) 0%, rgba(5,5,13,0) 100%);
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }

  .back-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px;
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.22);
    border-radius: 4px;
    color: #94a3b8;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
    backdrop-filter: blur(6px);
  }
  .back-btn:hover {
    color: #fff;
    border-color: #60a5fa;
    box-shadow: 0 0 18px rgba(96,165,250,0.5);
    transform: translateY(-1px);
  }
  .back-btn:active { transform: translateY(0) scale(0.98); }

  .mode-title {
    font-family: 'Michroma', sans-serif;
    font-size: 18px;
    letter-spacing: 0.3em;
    color: #7dd3fc;
    text-shadow:
      0 0 8px rgba(125,211,252,0.9),
      0 0 24px rgba(56,189,248,0.5);
  }

  .progress-box {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.22);
    border-radius: 4px;
    backdrop-filter: blur(6px);
  }
  .progress-label { font-size: 11px; color: #64748b; letter-spacing: 0.15em; }
  .progress-value {
    font-family: 'Michroma', sans-serif;
    font-size: 14px; color: #7dd3fc;
    letter-spacing: 0.1em;
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .sync-btn { font-size: 12px; padding: 9px 14px; letter-spacing: 0.14em; }

  /* ===== 存档码弹窗 ===== */
  .modal-card.code-card { max-width: 520px; }
  .code-label {
    font-size: 11px; color: #64748b; letter-spacing: 0.16em;
    margin-bottom: 8px;
  }
  .code-label .count { color: #475569; }
  .code-area {
    width: 100%;
    min-height: 58px;
    padding: 10px 12px;
    background: rgba(2, 6, 16, 0.9);
    border: 1px solid rgba(96,165,250,0.25);
    border-radius: 6px;
    color: #7dd3fc;
    font-family: 'Michroma', monospace;
    font-size: 12px;
    line-height: 1.7;
    letter-spacing: 0.08em;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  .code-area:focus { border-color: rgba(96,165,250,0.6); }
  .code-area::placeholder {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; letter-spacing: 0.05em; color: #475569;
  }
  .code-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .code-act {
    flex: 1; min-width: 130px;
    padding: 11px 14px;
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.28);
    border-radius: 6px;
    color: #cbd5e1;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .code-act:hover { color: #fff; border-color: #60a5fa; background: rgba(20,30,50,0.95); }
  .code-act.primary { color: #04121f; background: #38bdf8; border-color: #38bdf8; }
  .code-act.primary:hover { background: #7dd3fc; border-color: #7dd3fc; }
  .code-sep { height: 1px; background: rgba(42,42,78,0.9); margin: 18px 0; }
  .code-hint {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.75;
    letter-spacing: 0.04em;
    color: #64748b;
    min-height: 18px;
  }
  .code-hint .ok { color: #7dd3fc; }
  .code-hint .warn { color: #fbbf24; }
  @media (max-width: 520px) {
    .mode-title { font-size: 13px; letter-spacing: 0.12em; }
    .sync-btn { padding: 8px 9px; font-size: 11px; letter-spacing: 0.04em; }
    .progress-box { padding: 7px 10px; gap: 6px; }
    .progress-label { display: none; }
  }
  @media (max-width: 380px) {
    .topbar { padding: 12px 14px; }
    .back-btn { padding: 8px 12px; font-size: 12px; }
    .mode-title { display: none; }
  }

  /* ===== 星图 ===== */
  .map-viewport {
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    padding-bottom: 90px;
    padding-top: 70px;
  }
  .map-viewport::-webkit-scrollbar { width: 6px; }
  .map-viewport::-webkit-scrollbar-track { background: transparent; }
  .map-viewport::-webkit-scrollbar-thumb {
    background: rgba(96,165,250,0.2);
    border-radius: 3px;
  }
  .map-viewport::-webkit-scrollbar-thumb:hover {
    background: rgba(96,165,250,0.4);
  }

  .map-canvas {
    position: relative;
    width: 100%;
    margin: 0 auto;
  }

  .connection-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ===== 关卡节点 ===== */
  .level-node {
    position: absolute;
    transform: translate(-50%, 50%);
    z-index: 3;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .level-node.locked {
    cursor: not-allowed;
  }

  .node-body {
    position: relative;
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1a2540 0%, #0a0f20 100%);
    border: 2px solid rgba(148,163,184,0.3);
    font-family: 'Michroma', sans-serif;
    font-size: 15px;
    color: #64748b;
    transition: all 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
    box-shadow: 0 0 0 4px rgba(5,5,13,0.6);
  }

  .level-node:not(.locked):hover .node-body {
    border-color: #60a5fa;
    color: #fff;
    transform: scale(1.1);
    box-shadow:
      0 0 0 4px rgba(5,5,13,0.6),
      0 0 24px rgba(96,165,250,0.7),
      inset 0 0 20px rgba(96,165,250,0.3);
  }
  .level-node:not(.locked):active .node-body {
    transform: scale(1.0);
  }

  /* 已通关至少 EASY */
  .level-node.done-easy .node-body {
    border-color: #22d3ee;
    color: #7dd3fc;
    box-shadow:
      0 0 0 4px rgba(5,5,13,0.6),
      0 0 18px rgba(34,211,238,0.5),
      inset 0 0 16px rgba(34,211,238,0.15);
  }

  /* 已通关 HARD */
  .level-node.done-hard .node-body {
    border-color: #fb923c;
    color: #fdba74;
    box-shadow:
      0 0 0 4px rgba(5,5,13,0.6),
      0 0 20px rgba(251,146,60,0.6),
      inset 0 0 16px rgba(251,146,60,0.18);
  }

  /* 已通关 X MODE */
  .level-node.done-x .node-body {
    border-color: #a855f7;
    color: #d8b4fe;
    background: radial-gradient(circle at 35% 30%, #3b1d5c 0%, #150a26 100%);
    box-shadow:
      0 0 0 4px rgba(5,5,13,0.6),
      0 0 26px rgba(168,85,247,0.75),
      inset 0 0 20px rgba(168,85,247,0.35);
  }

  /* X MODE 通关后的外圈旋转光晕 + X 标记 */
  .level-node.done-x .node-x-ring {
    display: block;
  }
  .node-x-ring {
    display: none;
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1.5px dashed rgba(168,85,247,0.55);
    animation: xRingSpin 12s linear infinite;
    pointer-events: none;
  }
  @keyframes xRingSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .node-x-badge {
    display: none;
    position: absolute;
    top: -6px; right: -6px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #a855f7 0%, #6b21a8 100%);
    border: 1.5px solid #e9d5ff;
    color: #fff;
    font-family: 'Michroma', sans-serif;
    font-size: 11px; font-weight: 700;
    align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(168,85,247,0.9);
    z-index: 4;
  }
  .level-node.done-x .node-x-badge {
    display: flex;
  }

  /* 已通关 EASY 但未通关 HARD 时，节点下方的小勾 */
  .node-mini-marks {
    position: absolute;
    bottom: -18px;
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px;
    pointer-events: none;
  }
  .mini-mark {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(148,163,184,0.2);
    border: 1px solid rgba(148,163,184,0.35);
    transition: all 0.25s;
  }
  .mini-mark.easy.on {
    background: #22d3ee;
    border-color: #7dd3fc;
    box-shadow: 0 0 6px #22d3ee;
  }
  .mini-mark.hard.on {
    background: #fb923c;
    border-color: #fdba74;
    box-shadow: 0 0 6px #fb923c;
  }
  .mini-mark.x.on {
    background: #a855f7;
    border-color: #d8b4fe;
    box-shadow: 0 0 6px #a855f7;
  }

  .node-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: #475569;
    white-space: nowrap;
    transition: color 0.25s;
  }
  .level-node:not(.locked):hover .node-label {
    color: #94a3b8;
  }
  .level-node.locked .node-body {
    filter: grayscale(0.7);
    opacity: 0.4;
  }
  .level-node.locked .node-label {
    opacity: 0.5;
  }

  /* ===== 章节栏（底部固定） ===== */
  .chapter-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 24px 18px;
    background: linear-gradient(0deg, rgba(5,5,13,0.98) 0%, rgba(5,5,13,0.85) 70%, rgba(5,5,13,0) 100%);
    backdrop-filter: blur(8px);
  }

  .chapter-label {
    font-family: 'Michroma', sans-serif;
    font-size: 12px;
    letter-spacing: 0.4em;
    color: #475569;
    margin-right: 14px;
    padding-right: 14px;
    border-right: 1px solid rgba(71,85,105,0.4);
  }

  .chapter-btn {
    position: relative;
    width: 46px; height: 46px;
    border-radius: 8px;
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.22);
    color: #64748b;
    font-family: 'Michroma', sans-serif;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
    display: flex; align-items: center; justify-content: center;
  }
  .chapter-btn:hover:not(.locked):not(.active) {
    color: #e2e8f0;
    border-color: #60a5fa;
    box-shadow: 0 0 14px rgba(96,165,250,0.4);
    transform: translateY(-2px);
  }
  .chapter-btn.active {
    color: #05050d;
    background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 100%);
    border-color: #bae6fd;
    box-shadow:
      0 0 0 1px rgba(186,230,253,0.5),
      0 0 22px rgba(56,189,248,0.7);
  }
  .chapter-btn.locked {
    opacity: 0.35;
    cursor: not-allowed;
    filter: grayscale(0.7);
  }
  .chapter-btn .lock-icon {
    position: absolute;
    top: -4px; right: -4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #1e293b;
    border: 1px solid rgba(71,85,105,0.6);
    display: none;
    align-items: center; justify-content: center;
    font-size: 8px;
    color: #64748b;
  }
  .chapter-btn.locked .lock-icon { display: flex; }

  /* 章节切换时上方浮动标题 */
  .chapter-float-title {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-family: 'Michroma', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5em;
    color: #7dd3fc;
    text-shadow:
      0 0 12px rgba(125,211,252,0.9),
      0 0 30px rgba(56,189,248,0.5);
    opacity: 0.9;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.3s;
  }

  /* ===== 难度选择弹窗 ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(2, 4, 10, 0.78);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.show {
    display: flex;
    animation: overlayIn 0.24s ease-out;
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .modal-card {
    width: 100%;
    max-width: 460px;
    padding: 28px;
    background: linear-gradient(180deg, rgba(15,23,42,0.98) 0%, rgba(8,12,24,0.98) 100%);
    border: 1px solid rgba(96,165,250,0.35);
    border-radius: 8px;
    box-shadow:
      0 0 0 1px rgba(96,165,250,0.15),
      0 0 60px rgba(96,165,250,0.3),
      0 24px 60px rgba(0,0,0,0.7);
    animation: modalIn 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(16px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(42,42,78,0.8);
  }
  .modal-level-tag {
    font-family: 'Michroma', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #64748b;
  }
  .modal-level-name {
    font-family: 'Michroma', sans-serif;
    font-size: 22px;
    color: #7dd3fc;
    text-shadow: 0 0 14px rgba(125,211,252,0.6);
  }

  .difficulty-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .diff-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(15,23,42,0.85) 0%, rgba(8,12,24,0.95) 100%);
    border: 1.5px solid;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
    text-align: left;
    font-family: 'Rajdhani', sans-serif;
  }
  .diff-btn:hover {
    transform: translateY(-2px);
  }
  .diff-btn:active {
    transform: translateY(0) scale(0.99);
  }

  .diff-easy {
    border-color: rgba(34,211,238,0.45);
    color: #7dd3fc;
  }
  .diff-easy:hover {
    border-color: #22d3ee;
    box-shadow:
      0 0 0 1px rgba(34,211,238,0.4),
      0 0 24px rgba(34,211,238,0.4);
  }

  .diff-hard {
    border-color: rgba(251,146,60,0.45);
    color: #fdba74;
  }
  .diff-hard:hover {
    border-color: #fb923c;
    box-shadow:
      0 0 0 1px rgba(251,146,60,0.4),
      0 0 24px rgba(251,146,60,0.4);
  }

  .diff-x {
    border-color: rgba(168,85,247,0.5);
    color: #d8b4fe;
    background: linear-gradient(180deg, rgba(59,29,92,0.4) 0%, rgba(21,10,38,0.95) 100%);
  }
  .diff-x:hover {
    border-color: #a855f7;
    box-shadow:
      0 0 0 1px rgba(168,85,247,0.5),
      0 0 28px rgba(168,85,247,0.6);
  }

  .diff-name {
    font-family: 'Michroma', sans-serif;
    font-size: 15px;
    letter-spacing: 0.15em;
    margin-bottom: 3px;
  }
  .diff-sub {
    font-size: 11px;
    color: #64748b;
    letter-spacing: 0.08em;
    line-height: 1.3;
  }
  .diff-x .diff-sub { color: #a78bfa; opacity: 0.8; }

  .diff-status {
    flex-shrink: 0;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1.5px solid rgba(148,163,184,0.3);
    font-family: 'Michroma', sans-serif;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.22s;
  }
  .diff-easy .diff-status { border-color: rgba(34,211,238,0.5); color: #22d3ee; }
  .diff-hard .diff-status { border-color: rgba(251,146,60,0.5); color: #fb923c; }
  .diff-x .diff-status { border-color: rgba(168,85,247,0.5); color: #a855f7; }

  .diff-btn.cleared .diff-status {
    background: currentColor;
    color: #05050d !important;
    border-color: transparent;
    box-shadow: 0 0 12px currentColor;
  }
  .diff-easy.cleared .diff-status { background: #22d3ee; }
  .diff-hard.cleared .diff-status { background: #fb923c; }
  .diff-x.cleared .diff-status { background: #a855f7; color: #fff !important; }

  /* 锁定的难度按钮 */
  .diff-btn.diff-locked {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(0.6);
  }
  .diff-btn.diff-locked:hover {
    transform: none;
    box-shadow: none;
  }
  .diff-btn.diff-locked .diff-sub {
    color: #64748b !important;
    font-style: italic;
  }

  /* 查看剧情按钮 */
  .story-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 14px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(180deg, rgba(45, 20, 80, 0.5) 0%, rgba(15, 8, 40, 0.9) 100%);
    border: 1.5px solid rgba(168, 85, 247, 0.55);
    border-radius: 6px;
    color: #d8b4fe;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .story-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 120%, rgba(168, 85, 247, 0.4) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .story-btn:hover {
    color: #fff;
    border-color: #a855f7;
    transform: translateY(-2px);
    box-shadow:
      0 0 0 1px rgba(168, 85, 247, 0.5),
      0 0 24px rgba(168, 85, 247, 0.5);
  }
  .story-btn:hover::before { opacity: 1; }
  .story-btn:active { transform: translateY(0) scale(0.99); }

  .story-icon { font-size: 16px; }

  .modal-close {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: rgba(15,23,42,0.85);
    border: 1px solid rgba(148,163,184,0.25);
    border-radius: 6px;
    color: #94a3b8;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-close:hover {
    color: #fff;
    border-color: rgba(148,163,184,0.6);
    background: rgba(20,30,50,0.95);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%) translateY(24px);
    padding: 12px 30px;
    border-radius: 4px;
    background: rgba(8, 12, 24, 0.96);
    border: 1px solid rgba(96, 165, 250, 0.4);
    color: #e2e8f0;
    font-size: 14px;
    letter-spacing: 0.14em;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.32s cubic-bezier(0.2, 0.9, 0.3, 1);
    z-index: 100;
    backdrop-filter: blur(10px);
    white-space: nowrap;
    box-shadow: 0 0 20px rgba(96, 165, 250, 0.25);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast .highlight { color: #7dd3fc; font-weight: 700; text-shadow: 0 0 10px rgba(125,211,252,0.8); }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="grid-overlay"></div>
<div class="vignette"></div>

<!-- 顶部栏 -->
<div class="topbar">
  <button class="back-btn" id="backBtn">← 返回</button>
  <div class="mode-title">ADVENTURE</div>
  <div class="topbar-right">
    <button class="back-btn sync-btn" id="syncBtn">存档码</button>
    <div class="progress-box">
      <span class="progress-label">CLEARED</span>
      <span class="progress-value" id="progressValue">0 / 48</span>
    </div>
  </div>
</div>

<!-- 章节浮动标题 -->
<div class="chapter-float-title" id="chapterFloatTitle">启航</div>

<!-- 星图可滚动区域 -->
<div class="map-viewport" id="mapViewport">
  <div class="map-canvas" id="mapCanvas">
    <svg class="connection-svg" id="connectionSvg"></svg>
    <!-- 节点由 JS 动态生成 -->
  </div>
</div>

<!-- 章节栏 -->
<div class="chapter-bar" id="chapterBar">
  <div class="chapter-label">CHAPTER</div>
  <!-- 章节按钮由 JS 生成 -->
</div>

<!-- 难度弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-level-tag" id="modalLevelTag">LEVEL 01</span>
      <span class="modal-level-name" id="modalLevelName">第一战</span>
    </div>
    <div class="difficulty-list" id="difficultyList">
      <!-- 难度按钮由 JS 生成 -->
    </div>
    <button class="story-btn" id="storyBtn">
      <span class="story-icon">📖</span> 查看剧情
    </button>
    <button class="modal-close" id="modalClose">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 存档码弹窗 -->
<div class="modal-overlay" id="codeOverlay">
  <div class="modal-card code-card">
    <div class="modal-header">
      <span class="modal-level-tag">SAVE CODE</span>
      <span class="modal-level-name">存档码</span>
    </div>
    <div class="code-label">当前进度 · <span class="count" id="codeLenLabel"></span></div>
    <textarea class="code-area" id="codeOut" readonly spellcheck="false"></textarea>
    <div class="code-row">
      <button class="code-act primary" id="codeCopyBtn">复制进度码</button>
      <button class="code-act" id="codeCopyUrlBtn">复制备份链接</button>
    </div>
    <div class="code-hint" id="codeUrlHint">备份链接固定指向线上站点，直接发给别人就能打开。</div>
    <div class="code-sep"></div>
    <div class="code-label">导入进度码或备份链接</div>
    <textarea class="code-area" id="codeIn" placeholder="粘贴进度码，或带 #p= 的完整链接" spellcheck="false"></textarea>
    <div class="code-row">
      <button class="code-act primary" id="codeImportBtn">导入并合并</button>
      <button class="code-act" id="codeClearBtn">清空输入</button>
    </div>
    <div class="code-hint" id="codeHint">导入只补齐进度，不会覆盖已有记录。</div>
    <button class="modal-close" id="codeClose">关闭</button>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/pieces.js"></script>
<script src="js/starfield.js"></script>
<script src="js/save.js"></script>
<script src="js/progresscode.js"></script>
<script>
(() => {
  'use strict';

  // ==================== 常量 ====================
  const CHAPTER_COUNT = SL.save.CHAPTER_COUNT;
  const LEVELS_PER_CHAPTER = SL.save.LEVELS_PER_CHAPTER;

  // 章节信息
  const CHAPTERS = [
    { id: 1, name: '启航', subtitle: '' },
    { id: 2, name: '第二章', subtitle: '' },
    { id: 3, name: '第三章', subtitle: '' },
    { id: 4, name: '第四章', subtitle: '' },
  ];

  // 关卡名（占位，以后再定）
  function getLevelName(chapter, level) {
    return `LV.${String(level).padStart(2, '0')}`;
  }

  // 12 个关卡节点的横向位置（百分比），形成"星座攀升"曲线
  const NODE_LAYOUT = [
    { x: 50 },  // 1
    { x: 66 },  // 2
    { x: 74 },  // 3
    { x: 58 },  // 4
    { x: 38 },  // 5
    { x: 26 },  // 6
    { x: 36 },  // 7
    { x: 54 },  // 8
    { x: 70 },  // 9
    { x: 56 },  // 10
    { x: 38 },  // 11
    { x: 50 },  // 12（登顶，居中）
  ];

  const ROW_SPACING = 118;
  const BOTTOM_PADDING = 60;
  const TOP_PADDING = 80;

  // 存档逻辑委托给共享 save.js（调用点保持不变，便于调试接口复用）
  let save = SL.save.load();
  const lvKey = (ch, lv) => SL.save.lvKey(ch, lv);
  function loadSave() { return save; }
  function persistSave() { SL.save.persist(save); }
  function getProgress(ch, lv) { return SL.save.getProgress(save, ch, lv); }
  function isLevelUnlocked(ch, lv) { return SL.save.isLevelUnlocked(save, ch, lv); }
  function isChapterUnlocked(ch) { return SL.save.isChapterUnlocked(save, ch); }
  function countChapterCleared(ch) { return SL.save.countChapterCleared(save, ch); }

  const starCanvas = document.getElementById('starfield');
  SL.initStarfield(starCanvas, { count: 200, mode: 'layered', twinkle: true });

  // ==================== 状态 ====================
  const state = {
    chapter: 1,
    modalChapter: 1,
    modalLevel: 1,
  };

  const mapViewport = document.getElementById('mapViewport');
  const mapCanvas = document.getElementById('mapCanvas');
  const connectionSvg = document.getElementById('connectionSvg');
  const chapterBar = document.getElementById('chapterBar');
  const chapterFloatTitle = document.getElementById('chapterFloatTitle');
  const progressValue = document.getElementById('progressValue');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalLevelTag = document.getElementById('modalLevelTag');
  const modalLevelName = document.getElementById('modalLevelName');
  const difficultyList = document.getElementById('difficultyList');
  const modalClose = document.getElementById('modalClose');
  const toast = document.getElementById('toast');

  let toastTimer = null;
  function showToast(html) {
    toast.innerHTML = html;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ==================== 渲染星图 ====================
  function renderChapter(ch) {
    state.chapter = ch;

    const mapHeight = TOP_PADDING + BOTTOM_PADDING + (LEVELS_PER_CHAPTER - 1) * ROW_SPACING;
    mapCanvas.style.height = mapHeight + 'px';
    connectionSvg.setAttribute('viewBox', `0 0 ${mapCanvas.clientWidth || 1000} ${mapHeight}`);
    connectionSvg.style.height = mapHeight + 'px';

    [...mapCanvas.querySelectorAll('.level-node')].forEach(n => n.remove());

    const nodePositions = [];
    const containerWidth = mapCanvas.clientWidth || 1000;

    for (let lv = 1; lv <= LEVELS_PER_CHAPTER; lv++) {
      const idx = lv - 1;
      const layout = NODE_LAYOUT[idx];
      const progress = getProgress(ch, lv);
      const unlocked = isLevelUnlocked(ch, lv);

      const bottomPx = BOTTOM_PADDING + idx * ROW_SPACING;

      const node = document.createElement('div');
      node.className = 'level-node';
      if (!unlocked) node.classList.add('locked');
      if (progress.easy) node.classList.add('done-easy');
      if (progress.hard) node.classList.add('done-hard');
      if (progress.x)    node.classList.add('done-x');

      node.style.left = layout.x + '%';
      node.style.bottom = bottomPx + 'px';

      node.innerHTML = `
        <div class="node-x-ring"></div>
        <div class="node-body">${lv}</div>
        <div class="node-x-badge">✕</div>
        <div class="node-mini-marks">
          <span class="mini-mark easy ${progress.easy ? 'on' : ''}"></span>
          <span class="mini-mark hard ${progress.hard ? 'on' : ''}"></span>
          <span class="mini-mark x ${progress.x ? 'on' : ''}"></span>
        </div>
        <div class="node-label">LEVEL ${String(lv).padStart(2, '0')}</div>
      `;

      node.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!unlocked) {
          showToast('<span class="highlight">未解锁</span> · 请先通关上一关');
          return;
        }
        openLevelModal(ch, lv);
      });

      mapCanvas.appendChild(node);

      nodePositions.push({
        cx: (layout.x / 100) * containerWidth,
        cy: mapHeight - bottomPx,
      });
    }

    renderConnections(nodePositions, ch);

    requestAnimationFrame(() => {
      mapViewport.scrollTop = mapViewport.scrollHeight;
    });
  }

  function renderConnections(positions, ch) {
    while (connectionSvg.firstChild) connectionSvg.removeChild(connectionSvg.firstChild);

    const ns = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < positions.length - 1; i++) {
      const a = positions[i];
      const b = positions[i + 1];

      const lv = i + 1;
      const clearedA = getProgress(ch, lv).easy;
      const clearedB = getProgress(ch, lv + 1).easy;

      let stroke, width, opacity, dash;
      if (clearedA && clearedB) {
        stroke = '#22d3ee';
        width = 2;
        opacity = 0.7;
        dash = '0';
      } else if (clearedA) {
        stroke = '#60a5fa';
        width = 1.6;
        opacity = 0.5;
        dash = '6 6';
      } else {
        stroke = '#475569';
        width = 1.2;
        opacity = 0.28;
        dash = '3 6';
      }

      if (clearedA && clearedB) {
        const glow = document.createElementNS(ns, 'line');
        glow.setAttribute('x1', a.cx);
        glow.setAttribute('y1', a.cy);
        glow.setAttribute('x2', b.cx);
        glow.setAttribute('y2', b.cy);
        glow.setAttribute('stroke', '#22d3ee');
        glow.setAttribute('stroke-width', 5);
        glow.setAttribute('stroke-opacity', 0.18);
        glow.setAttribute('stroke-linecap', 'round');
        connectionSvg.appendChild(glow);
      }

      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', a.cx);
      line.setAttribute('y1', a.cy);
      line.setAttribute('x2', b.cx);
      line.setAttribute('y2', b.cy);
      line.setAttribute('stroke', stroke);
      line.setAttribute('stroke-width', width);
      line.setAttribute('stroke-opacity', opacity);
      line.setAttribute('stroke-linecap', 'round');
      if (dash !== '0') line.setAttribute('stroke-dasharray', dash);
      connectionSvg.appendChild(line);
    }
  }

  // ==================== 渲染章节栏 ====================
  function renderChapterBar() {
    [...chapterBar.querySelectorAll('.chapter-btn')].forEach(b => b.remove());

    for (const ch of CHAPTERS) {
      const unlocked = isChapterUnlocked(ch.id);
      const active = state.chapter === ch.id;

      const btn = document.createElement('button');
      btn.className = 'chapter-btn';
      if (active) btn.classList.add('active');
      if (!unlocked) btn.classList.add('locked');
      btn.textContent = ch.id;
      btn.innerHTML += `<span class="lock-icon">🔒</span>`;

      btn.addEventListener('click', () => {
        if (!unlocked) {
          showToast('<span class="highlight">章节未解锁</span> · 请先通关上一章');
          return;
        }
        if (state.chapter === ch.id) return;
        switchChapter(ch.id);
      });

      chapterBar.appendChild(btn);
    }
  }

  function switchChapter(ch) {
    state.chapter = ch;
    chapterFloatTitle.textContent = CHAPTERS[ch - 1].name;

    chapterFloatTitle.style.opacity = '0';
    setTimeout(() => {
      renderChapter(ch);
      renderChapterBar();
      chapterFloatTitle.style.opacity = '0.9';
    }, 180);
  }

  // ==================== 进度 ====================
  function updateProgress() {
    let totalCleared = 0;
    for (let ch = 1; ch <= CHAPTER_COUNT; ch++) {
      for (let lv = 1; lv <= LEVELS_PER_CHAPTER; lv++) {
        if (getProgress(ch, lv).easy) totalCleared++;
      }
    }
    const total = CHAPTER_COUNT * LEVELS_PER_CHAPTER;
    progressValue.textContent = `${totalCleared} / ${total}`;
  }

  // ==================== 难度弹窗 ====================
  function openLevelModal(ch, lv) {
    state.modalChapter = ch;
    state.modalLevel = lv;

    modalLevelTag.textContent = `${CHAPTERS[ch - 1].name} · LEVEL ${String(lv).padStart(2, '0')}`;
    modalLevelName.textContent = getLevelName(ch, lv);

    renderDifficultyList();
    modalOverlay.classList.add('show');
  }

  function closeLevelModal() {
    modalOverlay.classList.remove('show');
  }

  function renderDifficultyList() {
    difficultyList.innerHTML = '';
    const ch = state.modalChapter;
    const lv = state.modalLevel;
    const progress = getProgress(ch, lv);

    const DIFFS = [
      {
        key: 'easy',
        cls: 'diff-easy',
        name: 'EASY',
        sub: '标准难度 · 熟悉关卡机制',
        mark: '✓',
        unlocked: true,
        lockedTip: '',
      },
      {
        key: 'hard',
        cls: 'diff-hard',
        name: 'HARD',
        sub: '敌人更多 · 资源更紧',
        mark: '✓',
        unlocked: progress.easy,
        lockedTip: '需先通关 EASY',
      },
      {
        key: 'x',
        cls: 'diff-x',
        name: 'X MODE',
        sub: '极限挑战 · 通关解锁 X 标志',
        mark: '✕',
        unlocked: progress.hard,
        lockedTip: '需先通关 HARD',
      },
    ];

    for (const d of DIFFS) {
      const cleared = progress[d.key];
      const locked = !d.unlocked;

      const btn = document.createElement('button');
      btn.className = `diff-btn ${d.cls}`;
      if (cleared) btn.classList.add('cleared');
      if (locked) btn.classList.add('diff-locked');

      const subText = locked ? d.lockedTip : d.sub;

      let statusContent = '';
      if (cleared) statusContent = d.mark;
      else if (locked) statusContent = '🔒';

      btn.innerHTML = `
        <div>
          <div class="diff-name">${d.name}</div>
          <div class="diff-sub">${subText}</div>
        </div>
        <div class="diff-status">${statusContent}</div>
      `;

      btn.addEventListener('click', () => {
        if (locked) {
          showToast(`<span class="highlight">${d.lockedTip}</span>`);
          return;
        }
        enterLevel(ch, lv, d.key);
      });

      difficultyList.appendChild(btn);
    }
  }

  // ==================== 进入关卡 ====================
  function enterLevel(ch, lv, difficulty) {
    // 防御性检查：难度是否已解锁
    const progress = getProgress(ch, lv);
    if (difficulty === 'hard' && !progress.easy) {
      showToast('<span class="highlight">需先通关 EASY</span>');
      return;
    }
    if (difficulty === 'x' && !progress.hard) {
      showToast('<span class="highlight">需先通关 HARD</span>');
      return;
    }

    // 已做好的关卡页：EASY 模式直达。?d= 传难度，关卡页通关时按这个值写存档。
    // key 格式 c<章>-l<关>-<难度>，后续新关卡只需往表里加一行。
    const LEVEL_PAGES = {
      'c1-l1-easy': '1-1.html',
      'c1-l2-easy': '1-2.html',
    };
    const page = LEVEL_PAGES[`c${ch}-l${lv}-${difficulty}`];
    if (page) {
      window.location.href = `${page}?c=${ch}&l=${lv}&d=${difficulty}`;
    } else {
      showToast('<span class="highlight">关卡开发中</span> · 敬请期待');
    }
  }

  // ==================== 事件绑定 ====================
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  // 查看剧情按钮
  document.getElementById('storyBtn').addEventListener('click', () => {
    const ch = state.modalChapter;
    const lv = state.modalLevel;
    window.location.href = `story.html?c=${ch}&l=${lv}`;
  });

  modalClose.addEventListener('click', closeLevelModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeLevelModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeLevelModal(); closeCodeModal(); }
  });

  // 窗口尺寸变化：重绘（连接线依赖容器宽度）
  let resizeRaf = null;
  window.addEventListener('resize', () => {
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      renderChapter(state.chapter);
    });
  });

  // ==================== 存档码 ====================
  const codeOverlay = document.getElementById('codeOverlay');
  const codeOut = document.getElementById('codeOut');
  const codeIn = document.getElementById('codeIn');
  const codeHint = document.getElementById('codeHint');
  const codeLenLabel = document.getElementById('codeLenLabel');

  function refreshCodeOut() {
    const code = SL.progressCode.encode(save);
    codeOut.value = code;
    codeLenLabel.textContent = code.length + ' 个字符';
  }

  function openCodeModal() {
    refreshCodeOut();
    codeIn.value = '';
    codeHint.innerHTML = '导入只补齐进度，不会覆盖已有记录。';
    codeOverlay.classList.add('show');
  }

  function closeCodeModal() {
    codeOverlay.classList.remove('show');
  }

  // 导入：合并 + 落盘 + 刷新视图
  function importCode(raw) {
    const res = SL.progressCode.applyToSave(save, raw);
    if (!res.ok) return res;
    persistSave();
    renderChapter(state.chapter);
    renderChapterBar();
    updateProgress();
    return res;
  }

  function copyText(text, okMsg) {
    const done = () => showToast(okMsg);
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) done(); else showToast('<span class="highlight">请长按手动复制</span>');
      } catch (e) {
        showToast('<span class="highlight">请长按手动复制</span>');
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
  }

  document.getElementById('syncBtn').addEventListener('click', openCodeModal);
  document.getElementById('codeClose').addEventListener('click', closeCodeModal);
  codeOverlay.addEventListener('click', (e) => {
    if (e.target === codeOverlay) closeCodeModal();
  });
  document.getElementById('codeCopyBtn').addEventListener('click', () => {
    copyText(codeOut.value, '<span class="highlight">进度码已复制</span>');
  });
  document.getElementById('codeCopyUrlBtn').addEventListener('click', () => {
    copyText(SL.progressCode.backupURL(codeOut.value), '<span class="highlight">备份链接已复制</span>');
  });
  document.getElementById('codeClearBtn').addEventListener('click', () => {
    codeIn.value = '';
    codeIn.focus();
  });
  document.getElementById('codeImportBtn').addEventListener('click', () => {
    const raw = codeIn.value.trim();
    if (!raw) {
      codeHint.innerHTML = '<span class="warn">先粘贴进度码或备份链接</span>';
      return;
    }
    const res = importCode(raw);
    if (!res.ok) {
      const tip = res.reason === 'checksum' ? '校验失败，可能复制不完整'
        : res.reason === 'version' ? '进度码来自更新的版本，请刷新页面'
        : res.reason === 'length' ? '长度不对，进度码不完整'
        : '进度码格式不正确';
      codeHint.innerHTML = `<span class="warn">${tip}</span>`;
      return;
    }
    refreshCodeOut();
    codeHint.innerHTML = res.added > 0
      ? `<span class="ok">已合并 ${res.added} 项进度</span>`
      : '没有新进度可合并，本地记录已包含该码的全部内容';
  });

  // ==================== 启动 ====================

  // 带 #p= 进来：先合并再渲染，避免画面先闪一下旧进度
  const bootCode = SL.progressCode.readFromHash(location.hash);
  if (bootCode) {
    const res = SL.progressCode.applyToSave(save, bootCode);
    if (res.ok) {
      persistSave();
      SL.progressCode.stripHash();
      setTimeout(() => showToast(
        res.added > 0
          ? `<span class="highlight">进度码已导入</span> · 合并 ${res.added} 项`
          : '<span class="highlight">进度码已读取</span> · 无新增'
      ), 400);
    } else {
      SL.progressCode.stripHash();
      setTimeout(() => showToast('<span class="highlight">进度码无效</span> · 已忽略'), 400);
    }
  }

  chapterFloatTitle.textContent = CHAPTERS[0].name;
  renderChapter(1);
  renderChapterBar();
  updateProgress();

  // ==================== 调试接口 ====================
  window.__adventure = {
    get save() { return save; },
    set save(v) { save = v; },
    get state() { return state; },
    getProgress,
    isLevelUnlocked,
    isChapterUnlocked,
    countChapterCleared,
    CHAPTERS,
    LEVELS_PER_CHAPTER,
    resetProgress() {
      save = { version: 1, progress: {} };
      persistSave();
      renderChapter(state.chapter);
      renderChapterBar();
      updateProgress();
      showToast('<span class="highlight">进度已重置</span>');
    },
    completeLevel(ch, lv, diff = 'easy') {
      const key = lvKey(ch, lv);
      const prog = getProgress(ch, lv);
      save.progress[key] = { ...prog, [diff]: true };
      persistSave();
      renderChapter(state.chapter);
      renderChapterBar();
      updateProgress();
      showToast(`<span class="highlight">${ch}-${lv} ${diff}</span> 已标记通关`);
    },
    unlockAllChapters() {
      for (let ch = 1; ch <= CHAPTER_COUNT; ch++) {
        for (let lv = 1; lv <= LEVELS_PER_CHAPTER; lv++) {
          const key = lvKey(ch, lv);
          save.progress[key] = { easy: true, hard: false, x: false };
        }
      }
      persistSave();
      renderChapter(state.chapter);
      renderChapterBar();
      updateProgress();
      showToast('<span class="highlight">已解锁所有章节</span>');
    },
    encodeCode() { return SL.progressCode.encode(save); },
    importCode,
    openCodeModal,
  };
})();
</script>
</body>
